  <!--
    Patron oficial de Apps Script para componer varias vistas en una sola
    pagina servida por doGet() -> HtmlService.createTemplateFromFile('Index').evaluate()
    Documentacion: https://developers.google.com/apps-script/guides/html/templates

    Requiere agregar en backend/Codigo.gs (una sola vez, no existe hoy):

      function include(filename) {
        return HtmlService.createHtmlOutputFromFile(filename).getContent();
      }

    Los scriptlets de servidor (ver los "include" de arriba y abajo de este
    comentario) solo se evaluan cuando este archivo se sirve via
    createTemplateFromFile; no funcionan si se abre este .html directo en
    el navegador fuera de Apps Script.

    OJO al editar este comentario: HtmlService escanea el archivo completo
    buscando apertura-de-signo-menor seguida de interrogacion (el inicio de
    un scriptlet) en TODO el texto, incluso dentro de comentarios HTML como
    este -- no reconoce que es documentacion. Escribir aqui ese patron
    seguido despues de interrogacion-signo-mayor en algun punto posterior
    del archivo (aunque sea solo para explicarlo) hace que intente evaluar
    lo que haya en medio como codigo real y truene con un SyntaxError
    reportado, confusamente, contra backend/Codigo.gs -- paso el
    2026-07-25, no lo repitas.

    Al pegar estos archivos en el editor de Apps Script, el nombre del
    archivo va SIN extension .html (el tipo ya lo define el editor):
    "Index", "Styles", "Shared_Core", "View_PosicionBancaria".
  -->
  <?!= include('Shared_Core'); ?>
