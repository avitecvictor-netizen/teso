<script>
/**
 * VEVA - Nucleo de aplicacion (sin React / JSX / Babel).
 * Responsabilidad unica: namespace global, utilidades transversales,
 * bridge con Apps Script, layout base (sidebar) y router de vistas.
 * No contiene logica de negocio de ningun modulo especifico (separacion de capas).
 *
 * CSS: Tailwind estatico compilado (ver Styles.html), no CDN runtime, no Bootstrap.
 * Paleta y clases tomadas literal de _source/Index.jsx (React legado), no inventadas.
 */
window.VEVA = window.VEVA || {};

// ---------------------------------------------------------------------------
// VEVA.gas - bridge promisificado hacia google.script.run.
// Reemplaza el "gasCall" que en el prototipo React se duplicaba en cada
// componente (Cobranza, FlujoEfectivo, AdminFlujo, etc.) - aqui vive una sola vez.
// ---------------------------------------------------------------------------
VEVA.gas = function (fnName, payload) {
  return new Promise(function (resolve, reject) {
    if (typeof google === 'undefined' || !google.script || !google.script.run) {
      reject(new Error('google.script.run no disponible (se ejecuto fuera de Apps Script)'));
      return;
    }
    google.script.run
      .withSuccessHandler(resolve)
      .withFailureHandler(reject)
      [fnName](payload);
  });
};

// ---------------------------------------------------------------------------
// VEVA.fmt - formato de numeros y moneda, fuente unica.
// ---------------------------------------------------------------------------
VEVA.fmt = {
  mxn: function (n) {
    return new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN', maximumFractionDigits: 0 }).format(n || 0);
  },
  num: function (n) {
    return (n == null || isNaN(n)) ? '—' : Math.round(n).toLocaleString('es-MX');
  },
  signed: function (n) {
    if (n == null) return '—';
    var abs = Math.abs(Math.round(n)).toLocaleString('es-MX');
    return n < 0 ? '(' + abs + ')' : abs;
  },
  // Copiado literal de fmtK en _source/Index.jsx:158 (usado en tooltips/leyendas de graficas)
  k: function (v) {
    return v >= 1000000
      ? '$' + (v / 1000000).toFixed(1) + 'M'
      : '$' + Math.round(v / 1000).toLocaleString('es-MX') + 'K';
  }
};

// ---------------------------------------------------------------------------
// VEVA.dom - azucar minima para construir DOM sin JSX ni innerHTML masivo.
// No es un virtual DOM: crea nodos reales directamente. Se mantiene
// deliberadamente pequeno para no terminar reinventando React (regla KISS).
// ---------------------------------------------------------------------------
VEVA.dom = {
  el: function (tag, attrs, children) {
    var node = document.createElement(tag);
    attrs = attrs || {};
    Object.keys(attrs).forEach(function (k) {
      var v = attrs[k];
      if (v == null) return; // evita setAttribute(k, null) -> atributos booleanos (disabled) quedarian "presentes" siempre
      if (k === 'class') node.className = v;
      else if (k.indexOf('on') === 0 && typeof v === 'function') node.addEventListener(k.slice(2).toLowerCase(), v);
      else node.setAttribute(k, v);
    });
    (children || []).forEach(function (c) {
      if (c == null) return;
      node.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
    });
    return node;
  },
  clear: function (node) {
    while (node.firstChild) node.removeChild(node.firstChild);
  }
};

// ---------------------------------------------------------------------------
// VEVA.dom.multiSelect - dropdown de seleccion multiple, usado por 5 vistas
// del React original (Cobranza, ClasificadorMovimientos, ConciliacionMensual,
// ValidacionSaldos y otra) - se centraliza aqui por DRY en vez de duplicarlo.
// Puerto directo del componente MultiSelect (_source/Index.jsx linea 179).
// El estado "abierto/cerrado" no vive aca (este helper no tiene estado
// propio, solo pinta): cada vista lo guarda en su propio `state.openFilter`
// y lo pasa via cfg.isOpen, igual que el resto del patron state+redraw().
// ---------------------------------------------------------------------------
VEVA.dom.multiSelect = function (cfg) {
  var allSelected = cfg.value.length === 0;
  var display = allSelected ? (cfg.placeholder || 'Todos')
    : cfg.value.length === 1 ? cfg.value[0]
    : cfg.value.length + ' seleccionados';

  var btn = VEVA.dom.el('button', {
    class: 'flex items-center gap-2 px-3 py-1.5 bg-white border rounded-lg text-[12px] min-w-[130px] justify-between transition-all ' +
      (cfg.isOpen ? 'border-[#635bff]' : 'border-[#e6ebf1] hover:border-[#635bff]/50'),
    onClick: function (e) { e.stopPropagation(); cfg.onToggleOpen(); }
  }, [
    VEVA.dom.el('span', { class: allSelected ? 'text-[#697386]' : 'text-[#0a2540] font-medium' }, [display]),
    VEVA.icon('chevron-down', 11, 'text-[#697386] flex-shrink-0')
  ]);

  var wrap = VEVA.dom.el('div', { class: 'relative inline-block', 'data-multiselect': '1' }, [btn]);

  if (cfg.isOpen) {
    var items = [VEVA.dom.el('button', {
      class: 'w-full text-left px-4 py-2 text-[12px] text-[#697386] hover:bg-[#f6f9fc]',
      onClick: function (e) { e.stopPropagation(); cfg.onChange([]); }
    }, ['Todos'])];

    cfg.options.forEach(function (opt) {
      var checked = cfg.value.indexOf(opt) >= 0;
      var checkbox = VEVA.dom.el('input', { type: 'checkbox', class: 'accent-[#635bff]' }, []);
      checkbox.checked = checked;
      checkbox.addEventListener('click', function (e) { e.stopPropagation(); });
      checkbox.addEventListener('change', function () {
        var next = checked ? cfg.value.filter(function (v) { return v !== opt; }) : cfg.value.concat([opt]);
        cfg.onChange(next);
      });
      items.push(VEVA.dom.el('label', { class: 'flex items-center gap-3 px-4 py-2 hover:bg-[#f6f9fc] cursor-pointer' }, [
        checkbox, VEVA.dom.el('span', { class: 'text-[12px] text-[#0a2540]' }, [opt])
      ]));
    });

    wrap.appendChild(VEVA.dom.el('div', {
      class: 'absolute top-full mt-1 left-0 z-50 bg-white border border-[#e6ebf1] rounded-xl shadow-lg min-w-[180px] py-1 max-h-52 overflow-y-auto'
    }, items));
  }
  return wrap;
};

};

VEVA.icon = function (name, size, className) {
  var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('viewBox', '0 0 24 24');
  svg.setAttribute('width', size || 16);
  svg.setAttribute('height', size || 16);
  svg.setAttribute('fill', 'none');
  svg.setAttribute('stroke', 'currentColor');
  svg.setAttribute('stroke-width', '2');
  svg.setAttribute('stroke-linecap', 'round');
  svg.setAttribute('stroke-linejoin', 'round');
  if (className) svg.setAttribute('class', className);
  svg.innerHTML = VEVA.ICONS[name] || '';
  return svg;
};

// ---------------------------------------------------------------------------
// VEVA.router - reemplaza useState('view') + render condicional de React.
// Cada vista se registra con VEVA.registerView(id, { render, destroy }).
// Sin auto-refresh (regla 02.3): solo cambia de vista por click del usuario.
// ---------------------------------------------------------------------------
VEVA.views = {};
VEVA.registerView = function (id, viewModule) { VEVA.views[id] = viewModule; };

VEVA.router = (function () {
  var current = null;
  var mount = null;
  function go(viewId) {
    if (!mount) mount = document.getElementById('veva-main');
    if (current && VEVA.views[current] && typeof VEVA.views[current].destroy === 'function') {
      VEVA.views[current].destroy();
    }
    VEVA.dom.clear(mount);
    document.querySelectorAll('[data-nav]').forEach(function (btn) {
      var active = btn.getAttribute('data-nav') === viewId;
      btn.classList.toggle('bg-[#635bff]/10', active);
      btn.classList.toggle('text-[#635bff]', active);
      btn.classList.toggle('text-[#424770]', !active);
    });
    current = viewId;
    // Control de acceso por vista (2026-08-10, Bloque 1 de 3): VEVA.vistasPermitidas
    // se llena UNA vez, antes de la primera navegacion (ver DOMContentLoaded al
    // final de este archivo) -- nunca queda undefined en el momento en que go()
    // puede ser llamado por un click real del usuario. Si viewId no esta en la
    // lista, jamas se monta la vista real (ni siquiera el registerView existe
    // para el, el chequeo va primero) -- navegar a mano por consola a un id
    // fuera de lo permitido tampoco sirve de nada, el gate real ademas vive en
    // cada funcion de backend.
    if (VEVA.vistasPermitidas && VEVA.vistasPermitidas.indexOf(viewId) < 0) {
      mount.appendChild(VEVA.dom.el('div', { class: 'flex flex-col items-center justify-center py-20 text-[#697386] space-y-4' }, [
        VEVA.dom.el('div', { class: 'w-16 h-16 bg-white rounded-2xl border border-[#e6ebf1] flex items-center justify-center shadow-sm' }, [VEVA.icon('shield', 32, 'text-[#697386]')]),
        VEVA.dom.el('p', { class: 'italic font-medium text-[13px]' }, ['No tienes acceso a este módulo.'])
      ]));
      return;
    }
    var view = VEVA.views[viewId];
    if (!view) {
      mount.appendChild(VEVA.dom.el('div', { class: 'flex flex-col items-center justify-center py-20 text-[#697386] space-y-4' }, [
        VEVA.dom.el('div', { class: 'w-16 h-16 bg-white rounded-2xl border border-[#e6ebf1] flex items-center justify-center shadow-sm' }, [VEVA.icon('construction', 32, 'text-[#635bff]')]),
        VEVA.dom.el('p', { class: 'italic font-medium text-[13px]' }, ['El modulo "' + viewId + '" se encuentra en desarrollo.'])
      ]));
      return;
    }
    view.render(mount);
  }
  return { go: go };
})();

/** Filtra por VEVA.vistasPermitidas (2026-08-10, control de acceso por
 * vista) -- una seccion completa del menu se omite si NINGUNO de sus
 * items quedo permitido, en vez de mostrar un encabezado de seccion
 * vacio. Se llama DESPUES de que vistasPermitidas ya se resolvio (ver
 * DOMContentLoaded), nunca antes -- construir el sidebar sin esperar la
 * respuesta mostraria brevemente opciones que luego habria que ocultar. */
function vevaBuildSidebar() {
  var nav = document.getElementById('veva-sidebar-nav');
  VEVA.dom.clear(nav);
  var permitidas = VEVA.vistasPermitidas || [];
  VEVA.MENU.forEach(function (section) {
    var items = section.items.filter(function (item) { return permitidas.indexOf(item.id) >= 0; });
    if (!items.length) return;
    nav.appendChild(VEVA.dom.el('div', { class: 'px-4 mt-4 mb-2 text-[10px] font-bold text-[#697386] uppercase tracking-widest' }, [section.label]));
    items.forEach(function (item) {
      nav.appendChild(VEVA.dom.el('button', {
        class: 'w-full flex items-center gap-3 px-4 py-2 rounded-xl text-[13px] font-medium transition-all text-[#424770] hover:bg-[#f6f9fc]',
        'data-nav': item.id,
        onClick: function () { VEVA.router.go(item.id); }
      }, [VEVA.icon(item.icon, 16, 'text-[#697386]'), item.label]));
    });
  });
}

// ---------------------------------------------------------------------------
// Toggle de sidebar - equivalente a sidebarOpen/setSidebarOpen del App
// original (_source/Index.jsx:3579, 3634). Colapsa a w-0 igual que alla.
// ---------------------------------------------------------------------------
function vevaSetupHeader() {
  var toggleBtn = document.getElementById('veva-menu-toggle');
  var avatar = document.getElementById('veva-user-avatar');
  if (toggleBtn) toggleBtn.appendChild(VEVA.icon('menu', 18));
  if (avatar) avatar.appendChild(VEVA.icon('user', 20));

  var sidebar = document.getElementById('veva-sidebar');
  var open = true;
  if (toggleBtn && sidebar) {
    toggleBtn.addEventListener('click', function () {
      open = !open;
      sidebar.classList.toggle('w-64', open);
      sidebar.classList.toggle('w-0', !open);
    });
  }

  // vevaCargarUsuarioHeader() ya NO se llama aqui (2026-08-10) -- ahora
  // el bootstrap (DOMContentLoaded) la llama directo y ESPERA su
  // resultado antes de construir el sidebar/navegar, porque tambien
  // resuelve VEVA.vistasPermitidas (control de acceso por vista).
}

/** Header real de sesion (2026-07-27, hallazgo del usuario): antes
 * mostraba "Usuario Demo"/"Administrador" fijo sin importar quien
 * entrara -- cero confirmacion visual de que Google identifico a la
 * persona real, aunque el backend SI capturaba correctamente el email
 * real via Session.getActiveUser().getEmail() en toda la auditoria
 * (Svc_Pagos.js). Session.getActiveUser() en Apps Script solo expone
 * getEmail(), no un nombre para mostrar -- se usa el email como linea
 * principal (siempre disponible para cualquier usuario del dominio,
 * la autenticacion real de Google ya ocurrio antes de que esta pagina
 * cargue, `access:"DOMAIN"` en appsscript.json la hace obligatoria) y
 * el/los rol(es) de CAT_USUARIOS como segunda linea si la persona esta
 * registrada ahi (ese catalogo es especifico del modulo de Pagos, no
 * todos los usuarios del resto de TESO lo estan). getUsuarioActual ya
 * existe en Svc_Pagos.js pero es una funcion global de Apps Script
 * (visible desde cualquier .gs del mismo proyecto), reusarla aqui no
 * es un acoplamiento nuevo. Si la llamada falla (o responde sin exito),
 * se reemplaza el texto por "Sesión no identificada" y se deja rastro en
 * `console.error` -- header no critico, nunca bloquea el resto de la
 * app, pero tampoco se queda en silencio ni colgado en "Cargando..."
 * para siempre (hallazgo real del revisor, 2 rondas). */
/** Devuelve la promesa (2026-08-10, antes no se retornaba nada) -- el
 * bootstrap ahora la espera antes de construir el sidebar/navegar,
 * porque esta misma llamada a getUsuarioActual ya trae
 * `vistasPermitidas` (control de acceso por vista), y el sidebar/router
 * necesitan ese dato ANTES de la primera pintura, no despues. */
function vevaCargarUsuarioHeader() {
  var nombreEl = document.getElementById('veva-user-name');
  var rolEl = document.getElementById('veva-user-role');
  return VEVA.gas('getUsuarioActual')
    .then(function (res) {
      if (!res || res.status !== 'success' || !res.data || !res.data.email) {
        console.error('getUsuarioActual no devolvio un email valido:', res);
        if (nombreEl) nombreEl.textContent = 'Sesión no identificada';
        VEVA.vistasPermitidas = [];
        // Hallazgo de revisor (2026-08-10): antes esto se trataba igual
        // que "0 vistas por rol", mostrando "contacta a finanzas" aunque
        // la causa real fuera otra (falla del backend, no una respuesta
        // de exito con datos vacios). Se guarda el mensaje real aparte
        // para que el bootstrap pueda distinguir los 2 casos.
        VEVA.vistasPermitidasError = (res && res.message) || 'No se pudo verificar tu acceso.';
        return;
      }
      // Nombre real (2026-08-12): antes se mostraba siempre el email
      // crudo, aunque el backend ya devolviera `nombre` (People API o
      // CAT_USUARIOS, ver getUsuarioActual). Si por algun motivo llega
      // vacio (fallo de People API Y sin fila en CAT_USUARIOS), se cae
      // al email tal cual -- nunca queda el header en blanco.
      if (nombreEl) nombreEl.textContent = res.data.nombre || res.data.email;
      if (rolEl) rolEl.textContent = (res.data.roles && res.data.roles.length) ? res.data.roles.join(' · ') : 'Sin rol asignado';
      VEVA.vistasPermitidas = res.data.vistasPermitidas || [];
      VEVA.vistasPermitidasError = null;
    })
    // Hallazgo real del revisor: el header es decorativo/no critico (nunca
    // debe bloquear el resto de la app si falla), pero eso no es lo mismo
    // que silenciar el error por completo -- console.error() deja rastro
    // depurable de una falla real (permisos, hoja movida, etc.), Y ADEMAS
    // (2026-08-10, 2da ronda de revisor) se le muestra al usuario un
    // mensaje real de error en vez de uno generico incorrecto. Si esta
    // llamada falla, VEVA.vistasPermitidas queda [] (fail-closed, mismo
    // criterio que _tieneAccesoAVista en el backend) -- nunca undefined,
    // para que el chequeo de VEVA.router.go no se salte por accidente.
    .catch(function (e) {
      console.error('vevaCargarUsuarioHeader fallo:', e);
      if (nombreEl) nombreEl.textContent = 'Sesión no identificada';
      VEVA.vistasPermitidas = [];
      VEVA.vistasPermitidasError = String((e && e.message) || e || 'Error de conexión.');
    });
}

document.addEventListener('DOMContentLoaded', function () {
  vevaSetupHeader();
  // Indicador de carga (2026-08-10, hallazgo de revisor): antes de este
  // cambio el sidebar/main se pintaban de inmediato sin esperar ninguna
  // respuesta del servidor; ahora sí esperan a getUsuarioActual, asi que
  // deben mostrar algo mientras tanto en vez de quedar en blanco.
  var mountInicial = document.getElementById('veva-main');
  if (mountInicial) mountInicial.appendChild(VEVA.dom.el('div', { class: 'flex items-center justify-center py-20 text-[#697386]' }, [VEVA.icon('loader', 20, 'animate-spin')]));
  vevaCargarUsuarioHeader().finally(function () {
    vevaBuildSidebar();
    var mount = document.getElementById('veva-main');
    if (VEVA.vistasPermitidasError) {
      // Caso real de falla (red/servidor) -- distinto del caso "0 vistas
      // por rol" de abajo. Nunca el mensaje generico de "contacta a
      // finanzas" cuando la causa real es otra.
      VEVA.dom.clear(mount);
      if (mount) mount.appendChild(VEVA.dom.el('div', { class: 'flex flex-col items-center justify-center py-20 text-[#697386] space-y-4' }, [
        VEVA.dom.el('div', { class: 'w-16 h-16 bg-white rounded-2xl border border-[#e6ebf1] flex items-center justify-center shadow-sm' }, [VEVA.icon('alert-circle', 32, 'text-red-500')]),
        VEVA.dom.el('p', { class: 'italic font-medium text-[13px] text-center max-w-xs' }, ['No se pudo verificar tu acceso: ' + VEVA.vistasPermitidasError]),
        VEVA.dom.el('button', { class: 'px-4 py-2 bg-[#635bff] text-white rounded-lg text-[12px] font-bold hover:bg-[#5851e5] transition-all', onClick: function () { location.reload(); } }, ['Reintentar'])
      ]));
    } else if (VEVA.vistasPermitidas && VEVA.vistasPermitidas.length) {
      VEVA.router.go(VEVA.vistasPermitidas.indexOf('posicion') >= 0 ? 'posicion' : VEVA.vistasPermitidas[0]);
    } else {
      VEVA.dom.clear(mount);
      if (mount) mount.appendChild(VEVA.dom.el('div', { class: 'flex flex-col items-center justify-center py-20 text-[#697386] space-y-4' }, [
        VEVA.dom.el('div', { class: 'w-16 h-16 bg-white rounded-2xl border border-[#e6ebf1] flex items-center justify-center shadow-sm' }, [VEVA.icon('shield', 32, 'text-[#697386]')]),
        VEVA.dom.el('p', { class: 'italic font-medium text-[13px] text-center max-w-xs' }, ['No tienes ningún módulo asignado todavía. Contacta a finanzas para que te den de alta en CAT_USUARIOS.'])
      ]));
    }
  });
});
</script>
