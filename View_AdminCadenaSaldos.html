<script>
/**
 * VEVA - Tab admin: Cadena de Saldos.
 * Responsabilidad unica: audita continuidad de saldo_banco_final[M-1] vs
 * saldo_inicial[M] por cuenta. Puerto directo de AdminCadenaSaldos
 * (_source/Index.jsx:4737). Sub-vista de 'admin-flujo' -- se registra en
 * VEVA.adminTabs.
 *
 * Backend citado: getCadenaSaldos (Svc_Auditoria.gs). Campos verificados:
 * data.periodos, data.filas[{cuenta,banco,sociedad,cadena[{periodo,
 * saldoFinal,saldoInicial,diferencia,ok}]}], data.alertas.
 */
(function () {
  function nowYM() { var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); }
  function prevYM(n) { var d = new Date(); d.setMonth(d.getMonth() - n); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); }

  var state = { desde: prevYM(5), hasta: nowYM(), filtSoc: '', data: null, loading: false, error: '' };

  function fmt(v) { return v === null || v === undefined ? '—' : Number(v).toLocaleString('es-MX', { maximumFractionDigits: 2 }); }

  function consultar() {
    if (!state.desde || !state.hasta) return;
    state.loading = true; state.error = ''; state.data = null; redraw();
    VEVA.gas('getCadenaSaldos', { desde: state.desde, hasta: state.hasta })
      .then(function (r) { if (r.status !== 'success') throw new Error(r.message); state.data = r.data; })
      .catch(function (e) { state.error = String(e.message || e); })
      .finally(function () { state.loading = false; redraw(); });
  }

  function getSociedades() {
    if (!state.data) return [];
    var s = {}; state.data.filas.forEach(function (f) { s[f.sociedad] = true; });
    return Object.keys(s).sort();
  }
  function getFilasFiltradas() {
    if (!state.data) return [];
    return state.filtSoc ? state.data.filas.filter(function (f) { return f.sociedad === state.filtSoc; }) : state.data.filas;
  }

  function renderCeldaCadena(c) {
    var bg = c.ok === true ? 'bg-emerald-50' : c.ok === false ? 'bg-red-50' : '';
    var tcl = c.ok === true ? 'text-emerald-700' : c.ok === false ? 'text-red-600' : 'text-[#c4c9d4]';
    var children = [VEVA.dom.el('div', { class: 'font-semibold ' + tcl }, [c.ok === true ? '✓' : c.ok === false ? '⚠' : '—'])];
    if (c.ok === false) {
      children.push(VEVA.dom.el('div', { class: 'text-[10px] text-red-500 mt-0.5 leading-tight' }, [
        VEVA.dom.el('div', {}, [fmt(c.diferencia)]),
        VEVA.dom.el('div', { class: 'text-[#aab0bb]' }, ['F:' + fmt(c.saldoFinal)]),
        VEVA.dom.el('div', { class: 'text-[#aab0bb]' }, ['I:' + fmt(c.saldoInicial)])
      ]));
    }
    return VEVA.dom.el('td', { class: 'px-2 py-1.5 border-b border-[#f0f0f0] text-center ' + bg, title: 'F: ' + fmt(c.saldoFinal) + ' | I: ' + fmt(c.saldoInicial) + ' | Dif: ' + fmt(c.diferencia) }, children);
  }

  function redraw() {
    var root = document.getElementById('admintab-cadena-root');
    if (!root) return;
    VEVA.dom.clear(root);

    var inDesde = VEVA.dom.el('input', { type: 'month', class: 'text-[12px] border border-[#e6ebf1] rounded-lg px-2 py-1.5 outline-none focus:border-[#635bff]' }, []);
    inDesde.value = state.desde; inDesde.addEventListener('change', function (e) { state.desde = e.target.value; });
    var inHasta = VEVA.dom.el('input', { type: 'month', class: 'text-[12px] border border-[#e6ebf1] rounded-lg px-2 py-1.5 outline-none focus:border-[#635bff]' }, []);
    inHasta.value = state.hasta; inHasta.addEventListener('change', function (e) { state.hasta = e.target.value; });

    var toolbar = [
      VEVA.dom.el('div', { class: 'flex items-center gap-1.5' }, [VEVA.dom.el('label', { class: 'text-[11px] text-[#697386] font-semibold uppercase' }, ['Desde']), inDesde]),
      VEVA.dom.el('div', { class: 'flex items-center gap-1.5' }, [VEVA.dom.el('label', { class: 'text-[11px] text-[#697386] font-semibold uppercase' }, ['Hasta']), inHasta]),
      VEVA.dom.el('button', { class: 'px-3 py-1.5 bg-[#635bff] text-white rounded-lg text-[12px] font-medium flex items-center gap-1.5 disabled:opacity-50', onClick: consultar, disabled: state.loading ? 'disabled' : null }, [VEVA.icon('search', 12), 'Consultar'])
    ];
    if (state.loading) toolbar.push(VEVA.dom.el('span', { class: 'text-[11px] text-[#697386] flex items-center gap-1.5' }, [VEVA.icon('loader', 11, 'animate-spin'), 'Consultando...']));
    if (state.error) toolbar.push(VEVA.dom.el('span', { class: 'text-[11px] text-red-500' }, [state.error]));
    if (state.data) {
      var sociedades = getSociedades();
      var selSoc = VEVA.dom.el('select', { class: 'text-[12px] border border-[#e6ebf1] rounded-lg px-2 py-1.5 outline-none focus:border-[#635bff] ml-auto' },
        [VEVA.dom.el('option', { value: '' }, ['Todas las sociedades'])].concat(sociedades.map(function (s) { return VEVA.dom.el('option', { value: s }, [s]); })));
      selSoc.value = state.filtSoc;
      selSoc.addEventListener('change', function (e) { state.filtSoc = e.target.value; redraw(); });
      toolbar.push(selSoc);
    }

    var children = [VEVA.dom.el('div', { class: 'flex items-center gap-3 flex-wrap' }, toolbar)];

    if (state.data) {
      var filasFiltradas = getFilasFiltradas();
      children.push(VEVA.dom.el('div', { class: 'flex gap-3' }, [
        VEVA.dom.el('div', { class: 'px-4 py-2 bg-[#f6f9fc] rounded-lg text-center min-w-[90px]' }, [VEVA.dom.el('div', { class: 'text-[10px] text-[#697386] font-semibold uppercase' }, ['Cuentas']), VEVA.dom.el('div', { class: 'text-xl font-bold text-[#0a2540]' }, [String(filasFiltradas.length)])]),
        VEVA.dom.el('div', { class: 'px-4 py-2 rounded-lg text-center min-w-[90px] ' + (state.data.alertas > 0 ? 'bg-red-50' : 'bg-emerald-50') }, [VEVA.dom.el('div', { class: 'text-[10px] font-semibold uppercase ' + (state.data.alertas > 0 ? 'text-red-600' : 'text-emerald-600') }, ['Alertas']), VEVA.dom.el('div', { class: 'text-xl font-bold ' + (state.data.alertas > 0 ? 'text-red-600' : 'text-emerald-700') }, [String(state.data.alertas)])]),
        VEVA.dom.el('div', { class: 'px-4 py-2 bg-[#f6f9fc] rounded-lg text-center min-w-[90px]' }, [VEVA.dom.el('div', { class: 'text-[10px] text-[#697386] font-semibold uppercase' }, ['Periodos']), VEVA.dom.el('div', { class: 'text-xl font-bold text-[#0a2540]' }, [String(state.data.periodos.length)])])
      ]));

      var theadRow = ['Sociedad', 'Banco', 'Cuenta'].map(function (h) { return VEVA.dom.el('th', { class: 'px-2 py-2 text-left font-semibold text-[#697386] border-b border-[#e6ebf1] whitespace-nowrap' }, [h]); })
        .concat(state.data.periodos.map(function (p) { return VEVA.dom.el('th', { class: 'px-2 py-2 text-center font-semibold text-[#697386] border-b border-[#e6ebf1] whitespace-nowrap', style: 'min-width:100px' }, [p]); }));
      var thead = VEVA.dom.el('thead', { class: 'bg-[#f6f9fc] sticky top-0 z-10' }, [VEVA.dom.el('tr', {}, theadRow)]);

      var bodyRows;
      if (!filasFiltradas.length) {
        bodyRows = [VEVA.dom.el('tr', {}, [VEVA.dom.el('td', { colspan: String(3 + state.data.periodos.length), class: 'px-3 py-8 text-center text-[#697386] italic' }, [state.data.filas.length === 0 ? 'Sin datos en el rango — recarga archivos para generar SUM_EFE/SUM_MOV' : 'Sin datos para la sociedad seleccionada'])])];
      } else {
        bodyRows = filasFiltradas.map(function (fila) {
          var tds = [
            VEVA.dom.el('td', { class: 'px-2 py-1.5 border-b border-[#f0f0f0] font-medium whitespace-nowrap' }, [fila.sociedad]),
            VEVA.dom.el('td', { class: 'px-2 py-1.5 border-b border-[#f0f0f0] text-[#697386] whitespace-nowrap' }, [fila.banco]),
            VEVA.dom.el('td', { class: 'px-2 py-1.5 border-b border-[#f0f0f0] font-mono whitespace-nowrap' }, [fila.cuenta])
          ].concat(fila.cadena.map(renderCeldaCadena));
          return VEVA.dom.el('tr', { class: 'hover:bg-[#f6f9fc]' }, tds);
        });
      }
      var table = VEVA.dom.el('table', { class: 'text-[11px] border-collapse', style: 'min-width:100%' }, [thead, VEVA.dom.el('tbody', {}, bodyRows)]);
      children.push(VEVA.dom.el('div', { class: 'overflow-auto max-h-[60vh]' }, [table]));
    }

    root.appendChild(VEVA.dom.el('div', { class: 'bg-white rounded-xl border border-[#e6ebf1] shadow-sm p-5 space-y-4' }, children));
  }

  VEVA.adminTabs = VEVA.adminTabs || {};
  VEVA.adminTabs.cadena = {
    render: function (mount) { mount.appendChild(VEVA.dom.el('div', { id: 'admintab-cadena-root' }, [])); redraw(); },
    destroy: function () {}
  };
})();
</script>
