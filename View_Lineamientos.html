  // Fechas -- portado tal cual de Lineamientos2.json (proximoCorteSemanal/

  // vivo, no solo tabla estatica). Sin dependencia del motor de UI
  // original -- son funciones puras sobre Date.
  // =====================================================================
  function parseFechaDDMMYYYY(str) {
    var partes = str.split('/').map(Number);
    var d = partes[0], m = partes[1], y = partes[2];
    if (!d || !m || !y) return null;
    return new Date(y, m - 1, d);
  }
  function formatFechaCorta(date) {
    return date.toLocaleDateString('es-MX', { weekday: 'long', day: 'numeric', month: 'long' });
  }
  function proximoCorteSemanal(now, cortes) {
    if (!cortes || !cortes.length) return null;
    function reglaPara(dow) { return cortes.filter(function (c) { return c.dias.indexOf(dow) >= 0; })[0]; }
    var dow = now.getDay();
    var mins = now.getHours() * 60 + now.getMinutes();
    var reglaHoy = reglaPara(dow);
    if (reglaHoy && mins < reglaHoy.hora) return { fecha: new Date(now), etiqueta: reglaHoy.etiqueta, esHoy: true };
    var next = new Date(now);
    for (var i = 0; i < 8; i++) {
      next.setDate(next.getDate() + 1);
      var r = reglaPara(next.getDay());
      if (r) return { fecha: next, etiqueta: r.etiqueta, esHoy: false };
    }
    return null;
  }
  function proximaExcepcion(lista, now) {
    if (!lista || !lista.length) return null;
    var hoy = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    var futuras = lista
      .map(function (e) { return Object.assign({}, e, { d: parseFechaDDMMYYYY(e.fecha) }); })
      .filter(function (e) { return e.d && e.d >= hoy; })
      .sort(function (a, b) { return a.d - b.d; });
    return futuras[0] || null;
  }

  // =====================================================================
  var COLOR_GRID = {
    blue: { bg: 'bg-[#635bff]/10', text: 'text-[#4c3fe0]', border: 'border-[#635bff]/20' },
    amber: { bg: 'bg-amber-50', text: 'text-amber-700', border: 'border-amber-200' },
    teal: { bg: 'bg-emerald-50', text: 'text-emerald-700', border: 'border-emerald-100' },
    red: { bg: 'bg-red-50', text: 'text-red-600', border: 'border-red-100' }
  };

  function renderLedgerCard(modulo) {
    if (!modulo.cortes) return null;
    var now = new Date();
    var corte = proximoCorteSemanal(now, modulo.cortes);
    var exc = proximaExcepcion(modulo.calendarioExcepciones, now);
    var hoy = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    var diasFaltan = exc ? diasEntre(hoy, exc.d) : null;

    var izq = VEVA.dom.el('div', {}, [
      VEVA.dom.el('div', { class: 'text-[10.5px] font-bold uppercase tracking-widest text-white/50 mb-1' }, ['Próxima excepción de calendario']),
      exc
        ? VEVA.dom.el('div', {}, [
            VEVA.dom.el('div', { class: 'font-mono text-[16px] font-semibold' }, [exc.fecha + ' · ' + exc.motivo]),
            VEVA.dom.el('div', { class: 'text-white/60 text-[11.5px] mt-1' }, [(exc.grupo ? 'Afecta a: ' + exc.grupo : 'Sin afectación al ciclo regular') + (exc.cambio ? ' — ' + exc.cambio : '')])
          ])
        : VEVA.dom.el('div', { class: 'text-white/60 text-[13px]' }, ['No hay excepciones próximas registradas.'])
    ]);
    var der = diasFaltan != null ? VEVA.dom.el('div', { class: 'text-right flex-shrink-0' }, [
      VEVA.dom.el('div', { class: 'font-mono text-2xl font-bold' }, [diasFaltan === 0 ? 'HOY' : String(diasFaltan)]),
      VEVA.dom.el('div', { class: 'text-[9.5px] uppercase tracking-widest text-white/50' }, [diasFaltan === 0 ? '' : 'días'])
    ]) : null;

    var bloqueCorte = corte ? VEVA.dom.el('div', { class: 'mb-4' }, [
      VEVA.dom.el('div', { class: 'flex items-center justify-between mb-1.5' }, [
        VEVA.dom.el('span', { class: 'text-[10.5px] font-bold uppercase tracking-widest text-white/50' }, ['Próximo corte de pagos']),
        VEVA.dom.el('span', { class: 'text-[9.5px] font-bold uppercase tracking-widest bg-white/10 px-2 py-0.5 rounded-full' }, ['En vivo'])
      ]),
      VEVA.dom.el('div', { class: 'font-mono text-[22px] font-semibold capitalize' }, [corte.esHoy ? 'Hoy, ' + formatFechaCorta(corte.fecha) : formatFechaCorta(corte.fecha)]),
      VEVA.dom.el('div', { class: 'text-white/70 text-[12.5px] mt-0.5' }, [corte.etiqueta])
    ]) : null;

    return VEVA.dom.el('div', { class: 'rounded-2xl p-5 mb-5', style: 'background:linear-gradient(135deg,#635bff,#3d2fb3)' }, [
      bloqueCorte,
      VEVA.dom.el('div', { class: 'flex items-start justify-between gap-4 pt-1 border-t border-white/10' + (bloqueCorte ? ' mt-1' : '') }, [izq, der].filter(Boolean))
    ].filter(Boolean));
  }

  function renderBloque(bloque) {
    if (bloque.tipo === 'texto') {
      return VEVA.dom.el('p', { class: 'text-[13px] text-[#425466] leading-relaxed mb-3' }, [bloque.texto]);
    }
    if (bloque.tipo === 'nota') {
      return VEVA.dom.el('div', { class: 'mb-3' }, [
        VEVA.dom.el('div', { class: 'text-[12.5px] font-bold text-[#0a2540] mb-0.5' }, [bloque.titulo]),
        bloque.texto ? VEVA.dom.el('p', { class: 'text-[13px] text-[#425466] leading-relaxed' }, [bloque.texto]) : null
      ].filter(Boolean));
    }
    if (bloque.tipo === 'alerta') {
      var esAdvertencia = bloque.variante === 'advertencia';
      return VEVA.dom.el('div', { class: 'rounded-lg border p-3 mb-3 ' + (esAdvertencia ? 'bg-red-50 border-red-100' : 'bg-[#635bff]/5 border-[#635bff]/20') }, [
        VEVA.dom.el('div', { class: 'text-[12.5px] font-bold mb-0.5 ' + (esAdvertencia ? 'text-red-700' : 'text-[#4c3fe0]') }, [bloque.titulo]),
        bloque.texto ? VEVA.dom.el('p', { class: 'text-[12.5px] leading-relaxed ' + (esAdvertencia ? 'text-red-700/90' : 'text-[#4c3fe0]/90') }, [bloque.texto]) : null
      ].filter(Boolean));
    }
    if (bloque.tipo === 'lista') {
      return VEVA.dom.el('div', { class: 'mb-3' }, [
        bloque.titulo ? VEVA.dom.el('div', { class: 'text-[12.5px] font-bold text-[#0a2540] mb-1.5' }, [bloque.titulo]) : null,
        VEVA.dom.el('ul', { class: 'list-disc pl-4 space-y-1' }, bloque.items.map(function (it) {
          return VEVA.dom.el('li', { class: 'text-[13px] text-[#425466] leading-relaxed' }, [it]);
        }))
      ].filter(Boolean));
    }
    if (bloque.tipo === 'checklist') {
      return VEVA.dom.el('div', { class: 'mb-3 space-y-1.5' }, bloque.items.map(function (it) {
        return VEVA.dom.el('div', { class: 'flex items-start gap-2' }, [
          VEVA.icon('check-circle', 14, 'text-[#c3c9d3] flex-shrink-0 mt-0.5'),
          VEVA.dom.el('span', { class: 'text-[13px] text-[#425466] leading-relaxed' }, [it])
        ]);
      }));
    }
    if (bloque.tipo === 'timebox') {
      return VEVA.dom.el('div', { class: 'space-y-1.5 mb-3' }, bloque.items.map(function (it) {
        return VEVA.dom.el('div', { class: 'flex items-center gap-3 border border-amber-200 rounded-lg px-3 py-2' }, [
          VEVA.dom.el('span', { class: 'font-mono text-[12.5px] font-bold text-amber-700 bg-amber-50 px-2 py-1 rounded flex-shrink-0' }, [it.hora]),
          VEVA.dom.el('span', { class: 'text-[13px] text-[#425466]' }, [it.texto])
        ]);
      }));
    }
    if (bloque.tipo === 'grid') {
      return VEVA.dom.el('div', { class: 'grid gap-2.5 mb-3', style: 'grid-template-columns:repeat(auto-fit,minmax(200px,1fr))' }, bloque.items.map(function (it) {
        var c = COLOR_GRID[it.color] || COLOR_GRID.blue;
        return VEVA.dom.el('div', { class: 'rounded-lg border p-3 ' + c.bg + ' ' + c.border }, [
          VEVA.dom.el('div', { class: 'text-[12px] font-bold mb-1 ' + c.text }, [it.titulo]),
          VEVA.dom.el('div', { class: 'text-[12px] leading-relaxed ' + c.text + '/90' }, [it.texto])
        ]);
      }));
    }
    if (bloque.tipo === 'tabla-calendario') {
      return renderTablaCalendario(state.calendarioActivo || []);
    }
    return null;
  }

  function renderTablaCalendario(excepciones) {
    var head = ['Fecha', 'Motivo', 'Sociedades afectadas', 'Cambio'];
    return VEVA.dom.el('div', { class: 'border border-[#e6ebf1] rounded-lg overflow-hidden mb-3' }, [
      VEVA.dom.el('div', { class: 'overflow-x-auto' }, [
        VEVA.dom.el('table', { class: 'w-full border-collapse', style: 'min-width:520px' }, [
          VEVA.dom.el('thead', {}, [VEVA.dom.el('tr', {}, head.map(function (h) {
            return VEVA.dom.el('th', { class: 'bg-[#f6f9fc] border-b border-[#e6ebf1] px-2.5 py-1.5 text-[9.5px] font-bold uppercase tracking-wide text-[#8792a2] text-left whitespace-nowrap' }, [h]);
          }))]),
          VEVA.dom.el('tbody', {}, excepciones.map(function (e) {
            return VEVA.dom.el('tr', { class: 'border-b border-[#f0f2f6] last:border-0' }, [
              VEVA.dom.el('td', { class: 'px-2.5 py-1.5 text-[11.5px] font-mono text-[#697386] whitespace-nowrap' }, [e.fecha]),
              VEVA.dom.el('td', { class: 'px-2.5 py-1.5 text-[12px] font-semibold' }, [e.motivo]),
              VEVA.dom.el('td', { class: 'px-2.5 py-1.5 text-[11.5px] text-[#697386]' }, [e.grupo || '—']),
              VEVA.dom.el('td', { class: 'px-2.5 py-1.5 text-[11.5px] text-[#697386]' }, [e.cambio || '—'])
            ]);
          }))
        ])
      ])
    ]);
  }

  function renderSeccion(seccion) {
    return VEVA.dom.el('div', { class: 'bg-white border border-[#e6ebf1] rounded-xl p-4 mb-3.5' }, [
      VEVA.dom.el('div', { class: 'flex items-center gap-2 mb-3' }, [
        VEVA.icon(seccion.icono, 15, 'text-[#635bff] flex-shrink-0'),
        VEVA.dom.el('span', { class: 'font-mono text-[10.5px] text-[#c3c9d3]' }, [seccion.numero]),
        VEVA.dom.el('h3', { class: 'text-[14px] font-bold text-[#0a2540]' }, [seccion.titulo])
      ]),
      VEVA.dom.el('div', {}, seccion.bloques.map(renderBloque).filter(Boolean))
    ]);
  }

  function renderResumenEjecutivo(items) {
    return VEVA.dom.el('div', { class: 'bg-white border border-[#e6ebf1] rounded-xl p-4 mb-3.5' }, [
      VEVA.dom.el('h3', { class: 'text-[12px] font-bold uppercase tracking-wide text-[#8792a2] mb-2' }, ['Resumen ejecutivo']),
      VEVA.dom.el('ul', { class: 'list-disc pl-4 space-y-1.5' }, items.map(function (t) {
        return VEVA.dom.el('li', { class: 'text-[13px] text-[#425466] leading-relaxed' }, [t]);
      }))
    ]);
  }

  function renderStats(stats) {
    return VEVA.dom.el('div', { class: 'grid gap-2.5 mb-3.5', style: 'grid-template-columns:repeat(auto-fit,minmax(140px,1fr))' }, stats.map(function (s) {
      return VEVA.dom.el('div', { class: 'bg-white border border-[#e6ebf1] rounded-xl p-3 text-center' }, [
        VEVA.dom.el('div', { class: 'font-mono text-[18px] font-bold text-[#0a2540]' }, [s.valor]),
        VEVA.dom.el('div', { class: 'text-[10.5px] text-[#8792a2] uppercase tracking-wide mt-0.5' }, [s.etiqueta])
      ]);
    }));
  }

  function renderTablaSociedades(tabla) {
    return VEVA.dom.el('div', { class: 'bg-white border border-[#e6ebf1] rounded-xl overflow-hidden mb-3.5' }, [
      VEVA.dom.el('div', { class: 'px-4 pt-3 pb-1' }, [VEVA.dom.el('h3', { class: 'text-[12px] font-bold uppercase tracking-wide text-[#8792a2]' }, ['Día de pago por sociedad'])]),
      VEVA.dom.el('div', { class: 'overflow-x-auto' }, [
        VEVA.dom.el('table', { class: 'w-full border-collapse', style: 'min-width:480px' }, [
          VEVA.dom.el('thead', {}, [VEVA.dom.el('tr', {}, tabla.columnas.map(function (h) {
            return VEVA.dom.el('th', { class: 'border-b border-[#e6ebf1] px-4 py-1.5 text-[9.5px] font-bold uppercase tracking-wide text-[#8792a2] text-left whitespace-nowrap' }, [h]);
          }))]),
          VEVA.dom.el('tbody', {}, tabla.filas.map(function (fila) {
            return VEVA.dom.el('tr', { class: 'border-b border-[#f0f2f6] last:border-0' }, fila.map(function (v, i) {
              return VEVA.dom.el('td', { class: 'px-4 py-1.5 text-[12px]' + (i === 0 ? ' font-semibold' : ' text-[#697386]') }, [v]);
            }));
          }))
        ])
      ])
    ]);
  }

  function renderGlosario(glosario) {
    return VEVA.dom.el('div', { class: 'bg-white border border-[#e6ebf1] rounded-xl p-4 mb-3.5' }, [
      VEVA.dom.el('h3', { class: 'text-[12px] font-bold uppercase tracking-wide text-[#8792a2] mb-2.5' }, ['Glosario']),
      VEVA.dom.el('div', { class: 'space-y-2.5' }, glosario.map(function (g) {
        return VEVA.dom.el('div', {}, [
          VEVA.dom.el('div', { class: 'text-[12.5px] font-bold text-[#0a2540]' }, [g.termino]),
          VEVA.dom.el('div', { class: 'text-[12.5px] text-[#697386] leading-relaxed' }, [g.definicion])
        ]);
      }))
    ]);
  }

  function renderFaq(faq) {
    return VEVA.dom.el('div', { class: 'bg-white border border-[#e6ebf1] rounded-xl p-4 mb-3.5' }, [
      VEVA.dom.el('h3', { class: 'text-[12px] font-bold uppercase tracking-wide text-[#8792a2] mb-2.5' }, ['Preguntas frecuentes']),
      VEVA.dom.el('div', { class: 'space-y-3' }, faq.map(function (f) {
        return VEVA.dom.el('div', {}, [
          VEVA.dom.el('div', { class: 'text-[13px] font-bold text-[#0a2540] mb-0.5' }, [f.pregunta]),
          VEVA.dom.el('div', { class: 'text-[13px] text-[#425466] leading-relaxed' }, [f.respuesta])
        ]);
      }))
    ]);
  }

  function renderTabs() {
    return VEVA.dom.el('div', { class: 'flex gap-2 flex-wrap border-b border-[#e6ebf1] mb-4' }, MODULES_ORDEN.map(function (m) {
      var active = m.id === state.activeModulo;
      return VEVA.dom.el('div', {
        class: 'cursor-pointer px-4 py-2.5 text-[13px] font-semibold border-b-2 ' + (active ? 'text-[#0a2540] border-[#635bff]' : 'text-[#697386] border-transparent hover:text-[#0a2540]'),
        onClick: function () { state.activeModulo = m.id; redraw(); }
      }, [m.titulo]);
    }));
  }

  function renderModuloPendiente(modulo) {
    return VEVA.dom.el('div', { class: 'bg-white border border-dashed border-[#e6ebf1] rounded-xl p-10 text-center' }, [
      VEVA.icon('file-text', 28, 'text-[#c3c9d3] mx-auto mb-3'),
      VEVA.dom.el('p', { class: 'text-[14px] font-bold text-[#0a2540] mb-1' }, [modulo.meta.tituloLargo]),
      VEVA.dom.el('p', { class: 'text-[13px] text-[#697386]' }, ['Este módulo todavía no tiene contenido real publicado.'])
    ]);
  }

  function _redrawInner() {
    var root = document.getElementById('view-lineamientos-root');
    if (!root) return;
    VEVA.dom.clear(root);

    var modulo = MODULES[state.activeModulo];
    state.calendarioActivo = modulo.calendarioExcepciones;

    root.appendChild(VEVA.dom.el('div', {}, [
      VEVA.dom.el('h2', { class: 'text-2xl font-bold tracking-tight' }, ['Lineamientos']),
      VEVA.dom.el('p', { class: 'text-[13px] text-[#697386] mt-0.5 mb-4' }, ['Manual de referencia de procesos de Grupo Ventura. Solo lectura.'])
    ]));
    root.appendChild(renderTabs());

    if (modulo.pendiente) {
      root.appendChild(renderModuloPendiente(modulo));
      return;
    }

    var ledger = renderLedgerCard(modulo);
    if (ledger) root.appendChild(ledger);
    root.appendChild(renderResumenEjecutivo(modulo.resumenEjecutivo));
    root.appendChild(renderStats(modulo.statsRapidas));
    root.appendChild(renderTablaSociedades(modulo.diasPorSociedad));
    modulo.secciones.forEach(function (s) { root.appendChild(renderSeccion(s)); });
    root.appendChild(renderGlosario(modulo.glosario));
    root.appendChild(renderFaq(modulo.faq));
  }

  function redraw() {
    var mainScroll = document.getElementById('veva-main');
    var scrollTop = mainScroll ? mainScroll.scrollTop : 0;
    _redrawInner();
    if (mainScroll) mainScroll.scrollTop = scrollTop;
  }

  VEVA.registerView('lineamientos', {
    render: function (mount) {
      mount.appendChild(VEVA.dom.el('div', { id: 'view-lineamientos-root', class: 'space-y-0' }, []));
      redraw();
    },
    destroy: function () { /* sin listeners globales que limpiar */ }
  });
})();
</script>
