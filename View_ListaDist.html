<script>
/**
 * VEVA - Vista: Lista de Distribucion.
 * Responsabilidad unica: administrar destinatarios de reportes y enviar el
 * reporte de posicion bancaria por correo. Puerto directo de
 * AdminDistribucion (_source/Index.jsx:2362).
 *
 * Backends citados (tab "Reporte de Posicion"): getListaDistribucion,
 * guardarListaDistribucion, enviarReportePosicion (Codigo.gs). Campos
 * verificados: email, nombre, activo, fechaAlta.
 *
 * Bloque E (2026-07-27, pedido explicito del usuario): segunda pestaña
 * interna "CC de Pagos" -- lista de copia (CC) POR SOCIEDAD, permanente,
 * que se agrega a los 7 tipos de correo de pagos (Cargada/Confirmada/
 * Autorizada/Liberada/Subida/Aplicada/Rechazada). Se decidio metida
 * DENTRO de esta pantalla (a diferencia de "Notificaciones de Pagos",
 * que se hizo aparte) -- mismo archivo con pestanas internas, mismo
 * patron ya usado por View_Pagos.html (varias pestanas en un solo
 * archivo), no un contenedor+tabs repartido en archivos separados (sin
 * precedente en el proyecto, mas riesgo). Backends citados aqui:
 * getListaCcPagos, guardarListaCcPagos, getCatalogoCuentasPago
 * (Svc_Pagos.js). Complementa (no reemplaza) "Notificaciones de Pagos":
 * esa es el destinatario principal (TO), esta es la copia (CC).
 */
(function () {
  var SCOPES = [
    { id: 'actual', label: 'Posicion actual' },
    { id: 'anterior', label: 'Actual + Anterior' },
    { id: '5dias', label: 'Ultimos 5 dias' },
    { id: '15dias', label: 'Ultimos 15 dias' }
  ];

  var state = {
    activeSubTab: 'reporte',

    // ---- Tab "Reporte de Posicion" (original, sin cambios de logica) ----
    lista: [], loading: true, saving: false, sending: false, sendScope: 'actual',
    resultado: null, newEmail: '', newNombre: '', error: null,

    // ---- Tab "CC de Pagos" (Bloque E, nuevo) ----
    ccListaCompleta: [], ccSociedades: [], ccSociedadSel: '',
    ccLoading: true, ccSaving: false, ccError: null,
    ccNewEmail: '', ccNewNombre: '', ccUsuario: null, ccEsAdmin: false,
    ccNuevoSociedades: {}, ccCargado: false,
    // Modo "por persona" (2026-08-02): ver/editar el estado de un email a
    // traves de TODAS las sociedades a la vez -- antes solo se podia ver
    // sociedad por sociedad (dropdown), lo que hacia facil pensar que se
    // "desactivo" a alguien cuando en realidad solo se desactivo en la
    // sociedad que se tenia seleccionada, mientras seguia activo en otra.
    ccModo: 'sociedad', ccPersonaQuery: '',
    // Filas con EMAIL pero SOCIEDAD vacia -- invisibles en el resto de
    // esta pestana (auditoria 2026-08-13, ver _filasHuerfanasConfig en
    // Svc_Pagos.js).
    ccHuerfanas: [],

    // ---- Tab "Remitente" (2026-08-10, nueva) ----
    // Correo real de tesoreria corporativa que usan Posicion Bancaria y
    // la notificacion de pagos AUTORIZADA (getConfigTesoreria/
    // guardarConfigTesoreria, Svc_Pagos.js) -- las demas 6 transiciones
    // de pagos NO usan esto, salen de la cuenta real de quien ejecuta la
    // accion (ver comentario de _remitenteParaTransicion en el backend).
    // Gateado por una lista de administradores APARTE de CAT_USUARIOS
    // (esAdmin viene del backend, nunca se calcula en el cliente).
    remCargado: false, remLoading: true, remSaving: false, remError: null,
    remEmail: '', remAdmins: [], remEsAdmin: false, remNuevoAdminEmail: ''
  };

  function cargarLista() {
    state.loading = true; state.error = null; redraw();
    VEVA.gas('getListaDistribucion')
      .then(function (res) { if (res.status === 'success') state.lista = res.data; else state.error = res.message; })
      .catch(function (e) { state.error = e.message; })
      .finally(function () { state.loading = false; redraw(); });
  }

  function guardar(listaActual) {
    state.saving = true; redraw();
    VEVA.gas('guardarListaDistribucion', { lista: listaActual })
      .then(function (res) { if (res.status !== 'success') state.error = res.message; })
      .catch(function (e) { state.error = e.message; })
      .finally(function () { state.saving = false; redraw(); });
  }

  function agregar() {
    // Bug real (auditoria 2026-08-13, 3ra ronda): guarda de reentrada
    // explicita -- mismo criterio aplicado a ccAgregar/agregar (CC de
    // Pagos/Notificaciones de Pagos) para no reentrar mientras un
    // guardado anterior sigue en vuelo (el input dispara esta funcion
    // directo por Enter, sin pasar por el boton "Agregar").
    if (state.saving) return;
    if (state.newEmail.indexOf('@') < 0) return;
    var nueva = state.lista.concat([{ email: state.newEmail.trim(), nombre: state.newNombre.trim(), activo: true }]);
    state.lista = nueva; state.newEmail = ''; state.newNombre = '';
    guardar(nueva);
  }

  function toggleActivo(i) {
    var nueva = state.lista.map(function (r, idx) { return idx === i ? Object.assign({}, r, { activo: !r.activo }) : r; });
    state.lista = nueva; redraw();
    guardar(nueva);
  }

  function eliminar(i) {
    var nueva = state.lista.filter(function (r, idx) { return idx !== i; });
    state.lista = nueva; redraw();
    guardar(nueva);
  }

  function enviar() {
    var activos = state.lista.filter(function (r) { return r.activo; }).map(function (r) { return r.email; });
    if (!activos.length) { state.resultado = { status: 'error', message: 'No hay destinatarios activos' }; redraw(); return; }
    state.sending = true; state.resultado = null; redraw();
    VEVA.gas('enviarReportePosicion', { scope: state.sendScope, destinatarios: activos })
      .then(function (res) { state.resultado = res; })
      .catch(function (e) { state.resultado = { status: 'error', message: e.message }; })
      .finally(function () { state.sending = false; redraw(); });
  }

  function renderFilaDestinatario(r, i) {
    // Bug real (auditoria 2026-08-13, mismo patron aplicado a Notificaciones
    // de Pagos/CC de Pagos): se bloquea toggle/eliminar mientras
    // state.saving este activo, para no pisar/duplicar filas con 2 clics
    // rapidos (guardar() reemplaza toda la lista con el estado en ese momento).
    var editable = !state.saving;
    var toggle = VEVA.dom.el('button', {
      class: 'w-10 h-5 rounded-full transition-all relative flex-shrink-0 ' + (r.activo ? 'bg-[#635bff]' : 'bg-[#e6ebf1]') + (editable ? '' : ' opacity-50 cursor-not-allowed'),
      onClick: editable ? function () { toggleActivo(i); } : null
    }, [
      VEVA.dom.el('span', { class: 'absolute top-0.5 w-4 h-4 bg-white rounded-full shadow transition-all duration-200 ' + (r.activo ? 'left-5' : 'left-0.5') }, [])
    ]);
    return VEVA.dom.el('tr', { class: r.activo ? '' : 'opacity-50' }, [
      VEVA.dom.el('td', { class: 'px-5 py-3 font-mono text-[12px]' }, [r.email]),
      VEVA.dom.el('td', { class: 'px-5 py-3 text-[#697386]' }, [r.nombre || '—']),
      VEVA.dom.el('td', { class: 'px-5 py-3 text-center' }, [toggle]),
      VEVA.dom.el('td', { class: 'px-3 py-3' }, [editable ? VEVA.dom.el('button', { class: 'p-1 hover:bg-red-50 rounded text-[#697386] hover:text-red-500 transition-colors', onClick: function () { eliminar(i); } }, [VEVA.icon('x', 14)]) : null])
    ]);
  }

  function renderDestinatarios() {
    var header = VEVA.dom.el('div', { class: 'px-6 py-3 border-b border-[#e6ebf1] bg-[#f6f9fc] flex items-center justify-between' }, [VEVA.dom.el('p', { class: 'text-[11px] font-bold text-[#697386] uppercase tracking-wider' }, ['Destinatarios'])]);
    if (state.saving) header.appendChild(VEVA.dom.el('span', { class: 'text-[11px] text-[#697386] flex items-center gap-1.5' }, [VEVA.icon('loader', 11, 'animate-spin'), 'Guardando...']));

    var body;
    if (state.loading) {
      body = VEVA.dom.el('div', { class: 'p-6 space-y-2' }, [1, 2, 3].map(function () { return VEVA.dom.el('div', { class: 'h-12 bg-[#f6f9fc] rounded-lg animate-pulse' }, []); }));
    } else {
      var thead = VEVA.dom.el('thead', {}, [VEVA.dom.el('tr', { class: 'border-b border-[#e6ebf1]' }, [
        VEVA.dom.el('th', { class: 'px-5 py-2 text-left text-[10px] font-bold text-[#697386] uppercase tracking-wider' }, ['Email']),
        VEVA.dom.el('th', { class: 'px-5 py-2 text-left text-[10px] font-bold text-[#697386] uppercase tracking-wider' }, ['Nombre']),
        VEVA.dom.el('th', { class: 'px-5 py-2 text-center text-[10px] font-bold text-[#697386] uppercase tracking-wider' }, ['Activo']),
        VEVA.dom.el('th', { class: 'px-5 py-2 w-10' }, [])
      ])]);
      var rows = state.lista.map(renderFilaDestinatario);
      if (!state.lista.length) rows = [VEVA.dom.el('tr', {}, [VEVA.dom.el('td', { colspan: '4', class: 'px-5 py-6 text-center text-[13px] text-[#697386]' }, ['Sin destinatarios. Agrega uno abajo.'])])];
      body = VEVA.dom.el('table', { class: 'w-full text-[13px]' }, [thead, VEVA.dom.el('tbody', { class: 'divide-y divide-[#f6f9fc]' }, rows)]);
    }

    var inEmail = VEVA.dom.el('input', { type: 'email', placeholder: 'correo@empresa.com', class: 'w-full text-[12px] border border-[#e6ebf1] rounded-lg px-3 py-2 bg-white outline-none focus:border-[#635bff]', disabled: state.saving ? 'disabled' : null }, []);
    inEmail.value = state.newEmail;
    inEmail.addEventListener('input', function (e) { state.newEmail = e.target.value; });
    inEmail.addEventListener('keydown', function (e) { if (e.key === 'Enter') agregar(); });
    var inNombre = VEVA.dom.el('input', { type: 'text', placeholder: 'Nombre', class: 'w-full text-[12px] border border-[#e6ebf1] rounded-lg px-3 py-2 bg-white outline-none focus:border-[#635bff]', disabled: state.saving ? 'disabled' : null }, []);
    inNombre.value = state.newNombre;
    inNombre.addEventListener('input', function (e) { state.newNombre = e.target.value; });

    var agregarForm = VEVA.dom.el('div', { class: 'px-5 py-4 border-t border-[#e6ebf1] bg-[#f6f9fc]/50 flex flex-wrap gap-3 items-end' }, [
      VEVA.dom.el('div', { class: 'flex-1 min-w-[200px] space-y-1' }, [VEVA.dom.el('label', { class: 'text-[10px] font-bold text-[#697386] uppercase tracking-wider' }, ['Email']), inEmail]),
      VEVA.dom.el('div', { class: 'w-40 space-y-1' }, [VEVA.dom.el('label', { class: 'text-[10px] font-bold text-[#697386] uppercase tracking-wider' }, ['Nombre']), inNombre]),
      VEVA.dom.el('button', { class: 'px-4 py-2 bg-[#635bff] text-white rounded-lg text-[12px] font-bold hover:bg-[#5851e5] transition-all disabled:opacity-40 flex items-center gap-1.5', onClick: agregar, disabled: (state.newEmail.indexOf('@') < 0 || state.saving) ? 'disabled' : null }, [VEVA.icon('plus', 14), 'Agregar'])
    ]);

    return VEVA.dom.el('div', { class: 'bg-white rounded-xl border border-[#e6ebf1] shadow-sm overflow-hidden' }, [header, body, agregarForm]);
  }

  function renderEnvio() {
    var scopeBtns = SCOPES.map(function (s) {
      var active = state.sendScope === s.id;
      return VEVA.dom.el('button', { class: 'px-4 py-2 rounded-lg text-[12px] font-medium transition-all border ' + (active ? 'bg-[#635bff] text-white border-[#635bff]' : 'bg-white text-[#697386] border-[#e6ebf1] hover:border-[#635bff]/40'), onClick: function () { state.sendScope = s.id; redraw(); } }, [s.label]);
    });
    var activos = state.lista.filter(function (r) { return r.activo; }).length;
    var children = [
      VEVA.dom.el('div', {}, [VEVA.dom.el('p', { class: 'text-[11px] font-bold text-[#697386] uppercase tracking-wider mb-3' }, ['Alcance']), VEVA.dom.el('div', { class: 'flex flex-wrap gap-2' }, scopeBtns)]),
      VEVA.dom.el('div', { class: 'flex items-center justify-between pt-4 border-t border-[#f6f9fc]' }, [
        VEVA.dom.el('p', { class: 'text-[12px] text-[#697386]' }, ['Destinatarios activos: ', VEVA.dom.el('span', { class: 'font-bold text-[#0a2540]' }, [String(activos)])]),
        VEVA.dom.el('button', { class: 'flex items-center gap-2 px-6 py-2.5 bg-[#635bff] text-white rounded-lg text-[13px] font-bold hover:bg-[#5851e5] transition-all disabled:opacity-50', onClick: enviar, disabled: (state.sending || activos === 0) ? 'disabled' : null }, [VEVA.icon(state.sending ? 'loader' : 'send', 14, state.sending ? 'animate-spin' : ''), state.sending ? 'Enviando...' : 'Enviar Reporte'])
      ])
    ];
    if (state.resultado) {
      var ok = state.resultado.status === 'success';
      children.push(VEVA.dom.el('div', { class: 'p-4 rounded-xl border flex items-start gap-3 ' + (ok ? 'bg-emerald-50 border-emerald-100' : 'bg-red-50 border-red-100') }, [
        VEVA.icon(ok ? 'check-circle' : 'alert-circle', 16, 'flex-shrink-0 mt-0.5 ' + (ok ? 'text-emerald-500' : 'text-red-500')),
        VEVA.dom.el('p', { class: 'text-[13px] font-medium ' + (ok ? 'text-emerald-700' : 'text-red-700') }, [state.resultado.message])
      ]));
    }
    return VEVA.dom.el('div', { class: 'bg-white rounded-xl border border-[#e6ebf1] shadow-sm overflow-hidden' }, [
      VEVA.dom.el('div', { class: 'px-6 py-3 border-b border-[#e6ebf1] bg-[#f6f9fc]' }, [VEVA.dom.el('p', { class: 'text-[11px] font-bold text-[#697386] uppercase tracking-wider' }, ['Enviar Reporte de Posicion'])]),
      VEVA.dom.el('div', { class: 'p-6 space-y-5' }, children)
    ]);
  }

  function renderTabReporte() {
    return VEVA.dom.el('div', { class: 'space-y-6' }, [renderDestinatarios(), renderEnvio()]);
  }

  // =====================================================================
  // Tab "CC de Pagos" (Bloque E, 2026-07-27) -- mismo patron exacto que
  // View_NotificacionesPagos.html (selector de sociedad + tabla editable
  // + alta multi-sociedad), adaptado a getListaCcPagos/guardarListaCcPagos.
  // Prefijo `cc` en cada nombre para no chocar con el estado/funciones de
  // la tab "Reporte de Posicion" que comparte este mismo archivo.
  // =====================================================================

  /** ccPuedeEditar (corregido 2026-08-12, hallazgo de auditoria): antes
   * comparaba roles "Tesoreria"/"Contador" de CAT_USUARIOS -- desde el
   * Bloque 2 de control de acceso (2026-08-10) el backend real
   * (guardarListaCcPagos) ya NO acepta ese criterio, solo acepta
   * administradores de CONFIG_TESORERIA (_esAdminTesoreria). El frontend
   * viejo podia ocultar los controles de edicion a un administrador real
   * sin ese rol, mostrando el mensaje falso "Solo Tesoreria o Contador
   * pueden editar esta lista" aunque el backend si aceptara su cambio.
   * Ahora usa `state.ccEsAdmin`, calculado 100% server-side (mismo
   * criterio ya usado en la pestaña "Remitente", ver remEsAdmin) -- el
   * cliente nunca decide, solo refleja lo que el backend ya resolvio. */
  function ccPuedeEditar() {
    return !!state.ccEsAdmin;
  }

  function ccCargar() {
    state.ccCargado = true; state.ccLoading = true; state.ccError = null; redraw();
    Promise.all([VEVA.gas('getUsuarioActual'), VEVA.gas('getListaCcPagos'), VEVA.gas('getCatalogoCuentasPago'), VEVA.gas('getConfigTesoreria')])
      .then(function (res) {
        var resUsuario = res[0], resLista = res[1], resCat = res[2], resConfig = res[3];
        if (!resLista || resLista.status !== 'success') throw new Error((resLista && resLista.message) || 'Error al cargar la lista de CC');
        state.ccUsuario = (resUsuario && resUsuario.status === 'success') ? resUsuario.data : null;
        state.ccEsAdmin = (resConfig && resConfig.status === 'success') ? !!resConfig.data.esAdmin : false;
        state.ccListaCompleta = resLista.data;
        state.ccHuerfanas = resLista.huerfanas || [];
        var soc = {};
        ((resCat && resCat.status === 'success') ? resCat.data : []).forEach(function (c) { if (c.nombreCorto) soc[c.nombreCorto] = true; });
        state.ccSociedades = Object.keys(soc).sort();
        if (!state.ccSociedadSel && state.ccSociedades.length) state.ccSociedadSel = state.ccSociedades[0];
        if (state.ccSociedadSel) {
          state.ccNuevoSociedades = {};
          state.ccNuevoSociedades[state.ccSociedadSel] = true;
        }
      })
      .catch(function (e) { state.ccError = String(e.message || e); })
      .finally(function () { state.ccLoading = false; redraw(); });
  }

  function ccListaDeSociedad(sociedad) {
    return state.ccListaCompleta.filter(function (r) { return r.sociedad === sociedad; });
  }
  function ccListaDeSociedadActual() { return ccListaDeSociedad(state.ccSociedadSel); }

  /** Guarda 1 sociedad a la vez -- usada hoy por toggle/eliminar/editarCampo.
   * El alta multi-sociedad de ccAgregar() YA NO pasa por aqui desde
   * 2026-08-14 (ver comentario de ccAgregar() mas abajo): antes
   * encadenaba 1 llamada por sociedad marcada, ahora es 1 sola llamada a
   * agregarCcMultiSociedad. */
  function ccGuardarParaSociedad(sociedad, nuevaListaSociedad) {
    return VEVA.gas('guardarListaCcPagos', { sociedad: sociedad, lista: nuevaListaSociedad })
      .then(function (res) {
        // Bug real (2026-08-14): la respuesta del servidor puede llegar
        // vacia -- accedir res.status sin verificar primero que `res`
        // exista tronaba con "Cannot read properties of null" en vez de
        // mostrar un error claro. El guardado en si puede haber si
        // ocurrido en el servidor aunque la confirmacion no haya
        // llegado -- por eso el mensaje pide refrescar antes de repetir.
        if (!res) return { ok: false, message: 'Sin respuesta del servidor -- refresca la pantalla para confirmar si se guardó antes de repetir.' };
        if (res.status !== 'success') return { ok: false, message: res.message };
        // Bug reportado (2026-08-12): antes se actualizaba el estado local
        // con lo que ESTE cliente habia mandado a guardar, nunca con lo
        // que el servidor confirmo -- ante 2 guardados casi simultaneos
        // (o uno perdido) la pantalla quedaba desincronizada de la hoja
        // real sin ningun aviso ("agrego en BD pero no veo en pantalla").
        // Ahora se usa la lista que el backend devuelve como fuente de
        // verdad en vez del payload que se mando.
        var listaConfirmada = (res.data && res.data.lista) || nuevaListaSociedad;
        var deOtras = state.ccListaCompleta.filter(function (r) { return r.sociedad !== sociedad; });
        state.ccListaCompleta = deOtras.concat(listaConfirmada.map(function (r) { return Object.assign({ sociedad: sociedad }, r); }));
        return { ok: true };
      })
      .catch(function (e) { return { ok: false, message: String(e.message || e) }; });
  }

  function ccGuardar(nuevaListaSociedad) {
    state.ccSaving = true; redraw();
    ccGuardarParaSociedad(state.ccSociedadSel, nuevaListaSociedad)
      .then(function (r) { if (!r.ok) state.ccError = r.message; })
      .finally(function () { state.ccSaving = false; redraw(); });
  }

  /** Agrega el contacto nuevo a TODAS las sociedades marcadas en el
   * checklist. 2026-08-14 (bug real reportado): antes encadenaba 1
   * llamada de red por sociedad marcada (hasta 19 round-trips) -- cada
   * una era una oportunidad independiente de que la respuesta se
   * perdiera en el puente cliente-servidor de Apps Script ("Cannot read
   * properties of null"; el dato SI llegaba a guardarse pero la
   * confirmacion no). Ahora es UNA sola llamada a agregarCcMultiSociedad
   * con todas las sociedades en el payload. ccGuardarParaSociedad() ya
   * NO participa en este flujo. */
  function ccAgregar() {
    // Bug real (auditoria 2026-08-13, 3ra ronda): guarda de reentrada
    // explicita -- no depender solo del atributo disabled del boton, ya
    // que el input de email dispara esta misma funcion directo por Enter
    // (keydown), sin pasar por el boton.
    if (state.ccSaving) return;
    if (state.ccNewEmail.indexOf('@') < 0) return;
    var sociedadesDestino = Object.keys(state.ccNuevoSociedades).filter(function (s) { return state.ccNuevoSociedades[s]; });
    if (!sociedadesDestino.length) {
      state.ccError = 'Marca al menos una sociedad antes de agregar.';
      redraw();
      return;
    }
    var email = state.ccNewEmail.trim();
    var nombre = state.ccNewNombre.trim();
    state.ccNewEmail = ''; state.ccNewNombre = '';
    state.ccSaving = true; state.ccError = null; redraw();

    // Bug real (2026-08-14): antes esto encadenaba 1 llamada de red por
    // sociedad marcada (hasta 19 round-trips seguidos) -- cada una era
    // una oportunidad independiente de que la respuesta se perdiera en
    // el puente cliente-servidor de Apps Script ("Cannot read properties
    // of null", reportado por el usuario, el dato SI llegaba a guardarse
    // pero la confirmacion no). Ahora es UNA sola llamada con todas las
    // sociedades en el payload -- el servidor las guarda todas bajo un
    // solo LockService y regresa el resultado real de cada una.
    VEVA.gas('agregarCcMultiSociedad', { sociedades: sociedadesDestino, email: email, nombre: nombre })
      .then(function (res) {
        if (!res) { state.ccError = 'Sin respuesta del servidor -- refresca la pantalla para confirmar si se guardó antes de repetir.'; return; }
        if (res.status !== 'success') { state.ccError = res.message; return; }
        var resultados = res.data.resultados;
        var deOtras = state.ccListaCompleta.filter(function (r) { return sociedadesDestino.indexOf(r.sociedad) < 0; });
        var deEstas = resultados.reduce(function (acc, r) {
          return acc.concat(r.lista.map(function (row) { return Object.assign({ sociedad: r.sociedad }, row); }));
        }, []);
        state.ccListaCompleta = deOtras.concat(deEstas);
      })
      .catch(function (e) { state.ccError = String(e.message || e); })
      .finally(function () { state.ccSaving = false; redraw(); });
  }

  function ccToggleActivo(i) {
    var lista = ccListaDeSociedadActual();
    var nueva = lista.map(function (r, idx) { return idx === i ? Object.assign({}, r, { activo: !r.activo }) : r; });
    ccGuardar(nueva);
  }

  function ccEliminar(i) {
    var lista = ccListaDeSociedadActual();
    var nueva = lista.filter(function (r, idx) { return idx !== i; });
    ccGuardar(nueva);
  }

  function ccEditarCampo(i, campo, valor) {
    var lista = ccListaDeSociedadActual();
    var cambio = {};
    cambio[campo] = valor;
    var nueva = lista.map(function (r, idx) { return idx === i ? Object.assign({}, r, cambio) : r; });
    ccGuardar(nueva);
  }

  function ccRenderSelectorSociedad() {

  function ccEmailsUnicos() {
    var vistos = {};

    return Object.keys(vistos).sort();

  /** Al activar a alguien en una sociedad donde todavia no tiene fila, se
   * usa el nombre que ya tenga capturado en OTRA sociedad como valor por
   * defecto (editable despues) -- evita crear una fila con nombre vacio
   * si ya se conoce de otro lado. */
  function ccMejorNombreParaEmail(email) {
    var fila = state.ccListaCompleta.filter(function (r) { return r.email === email && r.nombre; })[0];
    return fila ? fila.nombre : '';
  }

  /** Prende/apaga a `email` en `sociedad` desde el modo "por persona". Si
   * ya existia una fila para esa combinacion, solo cambia `activo` (igual
   * que ccToggleActivo). Si NO existia (la persona nunca se agrego a esa
   * sociedad) y se esta prendiendo, crea la fila -- decision explicita del
   * usuario: un clic desde esta vista es intencional y debe bastar, sin
   * pasar por el formulario de alta. */
  function ccTogglePersonaSociedad(email, sociedad) {
    var listaSoc = ccListaDeSociedad(sociedad);
    var idx = listaSoc.map(function (r) { return r.email; }).indexOf(email);
    var nueva = idx >= 0
      ? listaSoc.map(function (r, i) { return i === idx ? Object.assign({}, r, { activo: !r.activo }) : r; })
      : listaSoc.concat([{ email: email, nombre: ccMejorNombreParaEmail(email), activo: true }]);
    state.ccSaving = true; redraw();
    ccGuardarParaSociedad(sociedad, nueva)
      .then(function (r) { if (!r.ok) state.ccError = r.message; })
      .finally(function () { state.ccSaving = false; redraw(); });
  }

    // Pagos, se bloquean toggle/eliminar/inputs mientras un guardado

    // rapidos (ccGuardarParaSociedad reemplaza TODA la sociedad).
    var editable = ccPuedeEditar() && !state.ccSaving;
    var toggle = ccRenderToggle(activo, editable, function () { ccTogglePersonaSociedad(email, sociedad); });
    return VEVA.dom.el('tr', { class: activo ? '' : 'opacity-50' }, [
      VEVA.dom.el('td', { class: 'px-5 py-3 font-semibold text-[13px]' }, [sociedad]),

  // =====================================================================
  // Tab "Remitente" (2026-08-10, nueva) -- correo real de tesoreria
  // corporativa usado por Posicion Bancaria y por la notificacion de
  // pagos AUTORIZADA. Prefijo `rem` en cada nombre por el mismo motivo
  // que `cc`: no chocar con el estado/funciones de las otras 2 tabs que
  // comparten este archivo.
  // =====================================================================

  function remCargar() {
    state.remCargado = true; state.remLoading = true; state.remError = null; redraw();
    VEVA.gas('getConfigTesoreria')
      .then(function (res) {
        if (!res || res.status !== 'success') throw new Error((res && res.message) || 'Error al cargar la configuración');
        state.remEmail = res.data.emailTesoreria || '';
        state.remAdmins = res.data.admins || [];
        state.remEsAdmin = !!res.data.esAdmin;
      })
      .catch(function (e) { state.remError = String(e.message || e); })
      .finally(function () { state.remLoading = false; redraw(); });
  }

  function remGuardar() {
    state.remSaving = true; state.remError = null; redraw();
    VEVA.gas('guardarConfigTesoreria', { emailTesoreria: state.remEmail, admins: state.remAdmins })
      .then(function (res) {
        if (res.status !== 'success') { state.remError = res.message; return; }
        state.remEmail = res.data.emailTesoreria;
        state.remAdmins = res.data.admins;
      })
      .catch(function (e) { state.remError = String(e.message || e); })
      .finally(function () { state.remSaving = false; redraw(); });
  }

  function remQuitarAdmin(email) {
    if (state.remAdmins.length <= 1) {
      state.remError = 'Debe quedar al menos un administrador.';
      redraw();
      return;
    }
    state.remAdmins = state.remAdmins.filter(function (e) { return e !== email; });
    remGuardar();
  }

  function remAgregarAdmin() {
    // Bug real (auditoria 2026-08-13, 4ta ronda): guarda de reentrada
    // explicita, mismo criterio ya aplicado a agregar()/ccAgregar() -- el
    // input dispara esta funcion directo por Enter (keydown), sin pasar
    // por el boton "Agregar admin" (que solo tiene disabled).
    if (state.remSaving) return;
    var email = state.remNuevoAdminEmail.trim();
    if (email.indexOf('@') < 0) return;
    if (state.remAdmins.indexOf(email.toLowerCase()) >= 0) { state.remNuevoAdminEmail = ''; redraw(); return; }
    state.remAdmins = state.remAdmins.concat([email.toLowerCase()]);
    state.remNuevoAdminEmail = '';
    remGuardar();
  }

  function remRenderNota() {
    return VEVA.dom.el('div', { class: 'px-4 py-3 bg-[#f6f9fc] border border-[#e6ebf1] rounded-xl text-[12px] text-[#697386] flex items-start gap-2.5' }, [
      VEVA.icon('mail', 14, 'text-[#697386] flex-shrink-0 mt-0.5'),
      VEVA.dom.el('span', {}, [
        'Este correo es el remitente real de ',
        VEVA.dom.el('b', {}, ['Posición Bancaria']),
        ' y de la notificación de pagos cuando una partida queda ',
        VEVA.dom.el('b', {}, ['Autorizada']),
        '. Las demás transiciones (cargada, revisión, liberación a banco, subida al banco, pago aplicado, rechazo) siempre salen de la cuenta real de quien ejecuta esa acción — este correo no las afecta.'
      ])
    ]);
  }

  function remRenderAviso() {
    return VEVA.dom.el('div', { class: 'px-4 py-3 bg-amber-50 border border-amber-100 rounded-xl text-[12px] text-amber-800 flex items-start gap-2.5' }, [
      VEVA.icon('alert-circle', 14, 'text-amber-600 flex-shrink-0 mt-0.5'),
      VEVA.dom.el('span', {}, [
        'Para que funcione, este correo debe estar configurado como alias "Enviar correo como" en la cuenta de Gmail de quien dispare Posición Bancaria o una autorización de pago — el sistema no puede verificar esto por adelantado. Si no está configurado, el envío fallará con un error visible, no en silencio.'
      ])
    ]);
  }

  function remRenderEmail() {
    // Bug real (auditoria 2026-08-13, mismo patron que el resto de esta
    // pantalla): se bloquea la edicion mientras state.remSaving este
    // activo, para no reentrar remGuardar() con un guardado anterior
    // todavia en vuelo (guardarConfigTesoreria reemplaza el correo/lista
    // de admins completos con lo que reciba).
    var editable = state.remEsAdmin && !state.remSaving;
    var inputEmail;
    if (editable) {
      inputEmail = VEVA.dom.el('input', { type: 'email', 'data-focus-key': 'rem-email', class: 'w-full text-[13px] border border-[#e6ebf1] rounded-lg px-3 py-2.5 bg-white outline-none focus:border-[#635bff]' }, []);
      inputEmail.value = state.remEmail;
      inputEmail.addEventListener('input', function (e) { state.remEmail = e.target.value; });
      inputEmail.addEventListener('change', remGuardar);
    } else {
      inputEmail = VEVA.dom.el('p', { class: 'text-[14px] font-mono font-semibold text-[#0a2540]' }, [state.remEmail || '—']);
    }
    return VEVA.dom.el('div', { class: 'space-y-1' }, [
      VEVA.dom.el('label', { class: 'text-[10px] font-bold text-[#697386] uppercase tracking-wider' }, ['Correo de tesorería corporativa']),
      inputEmail
    ]);
  }

  function remRenderAdmins() {
    // Mismo criterio que remRenderEmail (ver comentario ahi): bloqueado
    // mientras state.remSaving este activo.
    var editable = state.remEsAdmin && !state.remSaving;
    var chips = state.remAdmins.map(function (email) {
      return VEVA.dom.el('span', { class: 'inline-flex items-center gap-1.5 bg-[#f6f9fc] border border-[#e6ebf1] rounded-full pl-3 pr-1.5 py-1 text-[12px] font-mono' }, [
        email,
        editable ? VEVA.dom.el('button', { class: 'p-0.5 hover:bg-red-50 rounded-full text-[#697386] hover:text-red-500', onClick: function () { remQuitarAdmin(email); } }, [VEVA.icon('x', 11)]) : null
      ].filter(Boolean));
    });
    var children = [
      VEVA.dom.el('label', { class: 'text-[10px] font-bold text-[#697386] uppercase tracking-wider' }, ['Administradores (pueden editar este correo)']),
      VEVA.dom.el('div', { class: 'flex flex-wrap gap-2' }, chips)
    ];
    if (state.remEsAdmin) {
      var inNuevo = VEVA.dom.el('input', { type: 'email', placeholder: 'correo@empresa.com', 'data-focus-key': 'rem-nuevo-admin', class: 'text-[12px] border border-[#e6ebf1] rounded-lg px-3 py-2 bg-white outline-none focus:border-[#635bff] w-64', disabled: state.remSaving ? 'disabled' : null }, []);
      inNuevo.value = state.remNuevoAdminEmail;
      inNuevo.addEventListener('input', function (e) { state.remNuevoAdminEmail = e.target.value; });
      inNuevo.addEventListener('keydown', function (e) { if (e.key === 'Enter') remAgregarAdmin(); });
      children.push(VEVA.dom.el('div', { class: 'flex items-center gap-2 pt-1' }, [
        inNuevo,
        VEVA.dom.el('button', { class: 'px-3 py-2 bg-white border border-[#e6ebf1] rounded-lg text-[12px] font-semibold text-[#635bff] hover:border-[#635bff] transition-all disabled:opacity-40', onClick: remAgregarAdmin, disabled: state.remSaving ? 'disabled' : null }, ['Agregar admin'])
      ]));
    }
    return VEVA.dom.el('div', { class: 'space-y-2' }, children);
  }

  function remRenderTab() {
    var children = [remRenderNota()];
    if (state.remError) {
      children.push(VEVA.dom.el('div', { class: 'bg-red-50 border border-red-100 p-4 rounded-xl flex items-center gap-3' }, [VEVA.icon('alert-circle', 16, 'text-red-500 flex-shrink-0'), VEVA.dom.el('p', { class: 'text-[13px] text-red-700' }, [state.remError])]));
    }
    if (state.remLoading) {
      children.push(VEVA.dom.el('div', { class: 'p-6 space-y-2 bg-white rounded-xl border border-[#e6ebf1]' }, [1, 2].map(function () { return VEVA.dom.el('div', { class: 'h-12 bg-[#f6f9fc] rounded-lg animate-pulse' }, []); })));
      return VEVA.dom.el('div', { class: 'space-y-6' }, children);
    }
    if (!state.remEsAdmin) {
      children.push(VEVA.dom.el('div', { class: 'px-4 py-2.5 bg-[#f6f9fc] border border-[#e6ebf1] rounded-xl text-[12px] text-[#697386]' }, ['Solo un administrador de este correo puede editarlo. Puedes ver los valores actuales abajo.']));
    }
    var header = VEVA.dom.el('div', { class: 'px-6 py-3 border-b border-[#e6ebf1] bg-[#f6f9fc] flex items-center justify-between' }, [
      VEVA.dom.el('p', { class: 'text-[11px] font-bold text-[#697386] uppercase tracking-wider' }, ['Remitente de tesorería'])
    ]);
    if (state.remSaving) header.appendChild(VEVA.dom.el('span', { class: 'text-[11px] text-[#697386] flex items-center gap-1.5' }, [VEVA.icon('loader', 11, 'animate-spin'), 'Guardando...']));
    children.push(VEVA.dom.el('div', { class: 'bg-white rounded-xl border border-[#e6ebf1] shadow-sm overflow-hidden' }, [
      header,
      VEVA.dom.el('div', { class: 'p-5 space-y-5' }, [remRenderEmail(), remRenderAdmins()])
    ]));
    children.push(remRenderAviso());
    return VEVA.dom.el('div', { class: 'space-y-6' }, children);
  }

  // ---- Contenedor: pestanas internas + redraw compartido ----

  function renderTabs() {
    var tabs = [
      { id: 'reporte', label: 'Reporte de Posición' },
      { id: 'cc-pagos', label: 'CC de Pagos' },
      { id: 'remitente', label: 'Remitente' }
    ];
    return VEVA.dom.el('div', { class: 'flex gap-1 border-b border-[#e6ebf1]' }, tabs.map(function (t) {
      var active = state.activeSubTab === t.id;
      return VEVA.dom.el('button', {
        class: 'px-4 py-2.5 text-[12.5px] font-semibold border-b-2 -mb-px transition-colors ' + (active ? 'border-[#635bff] text-[#635bff]' : 'border-transparent text-[#697386] hover:text-[#0a2540]'),
        onClick: function () {
          state.activeSubTab = t.id;
          if (t.id === 'cc-pagos' && !state.ccCargado) ccCargar();
          if (t.id === 'remitente' && !state.remCargado) remCargar();
          redraw();
        }
      }, [t.label]);
    }));
  }

  function _redrawInner() {
    var root = document.getElementById('view-listadist-root');
    if (!root) return;
    VEVA.dom.clear(root);

    root.appendChild(VEVA.dom.el('div', {}, [
      VEVA.dom.el('h2', { class: 'text-2xl font-bold tracking-tight' }, ['Lista de Distribucion']),
      VEVA.dom.el('p', { class: 'text-[13px] text-[#697386] mt-0.5' }, ['Gestiona destinatarios de reportes y de correos de pagos'])
    ]));
    root.appendChild(renderTabs());
    if (state.activeSubTab === 'cc-pagos') {
      root.appendChild(ccRenderTab());
      return;
    }
    if (state.activeSubTab === 'remitente') {
      root.appendChild(remRenderTab());
      return;
    }
    if (state.error) {
      root.appendChild(VEVA.dom.el('div', { class: 'bg-red-50 border border-red-100 p-4 rounded-xl flex items-center gap-3' }, [VEVA.icon('alert-circle', 16, 'text-red-500 flex-shrink-0'), VEVA.dom.el('p', { class: 'text-[13px] text-red-700' }, [state.error])]));
    }
    root.appendChild(renderTabReporte());
  }

  /** Foco preservado al redibujar (necesario ahora que la tab CC de Pagos
   * tiene inputs editables que redibujan, mismo patron ya usado en
   * View_NotificacionesPagos.html/View_Pagos.html). */
  function redraw() {
    var activo = document.activeElement;
    var focusKey = null, selStart = null, selEnd = null;
    if (activo && activo.hasAttribute && activo.hasAttribute('data-focus-key')) {
      focusKey = activo.getAttribute('data-focus-key');
      if (typeof activo.selectionStart === 'number') { selStart = activo.selectionStart; selEnd = activo.selectionEnd; }
    }

    _redrawInner();

    if (focusKey) {
      var el = document.querySelector('[data-focus-key="' + focusKey + '"]');
      if (el) {
        el.focus();
        if (selStart != null && el.setSelectionRange) { try { el.setSelectionRange(selStart, selEnd); } catch (e) { } }
      }
    }
  }

  VEVA.registerView('lista-dist', {
    render: function (mount) {
      mount.appendChild(VEVA.dom.el('div', { id: 'view-listadist-root', class: 'space-y-6 max-w-3xl' }, []));
      cargarLista();
    },
    destroy: function () {}
  });
})();
</script>
