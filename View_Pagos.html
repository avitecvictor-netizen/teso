      var searchInput = VEVA.dom.el('input', { 'data-focus-key': 'buscar-' + p.id, class: 'w-[220px] h-7 border border-[#e6ebf1] rounded px-2 text-[12px] outline-none focus:border-[#635bff]', placeholder: 'Buscar proveedor...' }, []);
      searchInput.value = state.lineSearch[p.id] || '';
      searchInput.addEventListener('input', function (e) { state.lineSearch[p.id] = e.target.value; redraw(); });

      var visibleLineas = visible.reduce(function (acc, g) { return acc.concat(g.lineas); }, []);
      // Checkbox "seleccionar toda la propuesta" -- nivel 3 de seleccion
      // (linea / proveedor / propuesta completa, punto 6).
      var allChecked = visibleLineas.length > 0 && visibleLineas.every(function (l) { return l.checked; });
      var selAllCb = VEVA.dom.el('input', {
        type: 'checkbox',
        disabled: (tab === 'banca' || tab === 'aplicado') ? 'disabled' : null,
        title: (tab === 'banca' || tab === 'aplicado') ? 'No aplica en esta fase — usa Subir/Rechazar o Aplicar/No pagado' : 'Seleccionar toda la propuesta'
      }, []);
      selAllCb.checked = allChecked;
      selAllCb.addEventListener('change', function (e) { selectAllVisible(visibleLineas, e.target.checked); });

      var headBtns = [];
      if (tab === 'tesoreria' && esTesoreria()) {
        headBtns.push(VEVA.dom.el('button', { class: 'px-2.5 py-1 border border-[#e6ebf1] rounded text-[11px] hover:border-[#635bff]', onClick: function () { bulkSetType(lineas, 'total'); } }, ['Sel. → Total']));
        headBtns.push(VEVA.dom.el('button', { class: 'px-2.5 py-1 border border-[#e6ebf1] rounded text-[11px] hover:border-[#635bff]', onClick: function () { bulkSetType(lineas, 'parcial'); } }, ['Sel. → Parcial']));
      } else if ((tab === 'banca' || tab === 'aplicado') && esTesoreria()) {
        // Grupo 4 (2026-07-31): "seleccionar todas" para Banca/Aplicado --
        // selAllCb de arriba esta deshabilitado a proposito en estas 2
        // pestañas (opera sobre l.checked, sin efecto aqui desde el
        // Bloque F). Estos botones marcan _resolverPositivo/Negativo en
        // lote sobre TODAS las lineas visibles (respeta el buscador).
        var labelPosProp = tab === 'banca' ? 'Marcar todas: Subir' : 'Marcar todas: Aplicar';
        var labelNegProp = tab === 'banca' ? 'Marcar todas: Rechazar' : 'Marcar todas: No pagado';
        headBtns.push(VEVA.dom.el('button', { class: 'px-2.5 py-1 border border-[#635bff]/30 text-[#635bff] rounded text-[11px] hover:bg-[#635bff]/10', onClick: function () { marcarResolverLote(visibleLineas, '_resolverPositivo'); } }, [labelPosProp]));
        headBtns.push(VEVA.dom.el('button', { class: 'px-2.5 py-1 border border-red-200 text-red-600 rounded text-[11px] hover:bg-red-50', onClick: function () { marcarResolverLote(visibleLineas, '_resolverNegativo'); } }, [labelNegProp]));
        headBtns.push(VEVA.dom.el('button', { class: 'px-2.5 py-1 border border-[#e6ebf1] rounded text-[11px] hover:border-[#635bff]', onClick: function () { marcarResolverLote(visibleLineas, null); } }, ['Quitar marca']));
      }
      bodyChildren.push(VEVA.dom.el('div', { class: 'flex items-center gap-2.5 px-3 pt-2.5' }, [selAllCb, searchInput].concat(headBtns)));
      bodyChildren.push(VEVA.dom.el('div', { class: 'bg-white border border-[#e6ebf1] rounded-lg mx-3 mt-2 overflow-hidden' }, [
        renderColHead(tab),
        VEVA.dom.el('div', { class: 'max-h-[320px] overflow-y-auto' }, renderTablaPartidas(p, visible, tab))
      ]));

      var selectedLines = lineas.filter(function (l) { return l.checked; });
      var bulkBtns = [];
      // Pedido del usuario (2026-07-28): en cada fase, ver siempre cuanto
      // es el importe que se mueve, en moneda origen y su equivalente
      // MXN -- antes esta barra sumaba monedas distintas en una sola
      // cifra sin sentido (hallazgo real de auditoria), o en Banca/
      // Aplicado ni siquiera mostraba monto, solo conteos.
      var resumenNode = VEVA.dom.el('span', { class: 'text-[12px] text-[#697386]' }, [
        selectedLines.length + ' partidas seleccionadas' + (selectedLines.length ? ' · ' + resumenChipsTexto(selectedLines, montoEfectivo) : '')
      ]);
      if (tab === 'contabilidad' && puedeActuar('Contador')) {
        bulkBtns.push(renderBulkBtn('Liberar a Tesorería', 'Liberando...', function () { bulkAction(lineas, { fase: 'tesoreria' }); }, 'primario'));
      } else if (tab === 'tesoreria' && esTesoreria()) {
        bulkBtns.push(renderBulkBtn('Rechazar seleccionadas', 'Rechazando...', function () { bulkAction(lineas, { estado: 'rechazada' }); }, 'secundario'));
        bulkBtns.push(renderBulkBtn('Autorizar seleccionadas', 'Autorizando...', function () { autorizarSeleccionadas(lineas); }, 'primario'));
      } else if (tab === 'liberacion2' && puedeActuar('Contador')) {
        bulkBtns.push(renderBulkBtn('Liberar seleccionadas', 'Liberando...', function () { bulkAction(lineas, { status: 'liberada', fase: 'banca' }); }, 'primario'));
      } else if (tab === 'banca' && esTesoreria()) {
        var posB = lineas.filter(function (l) { return l._resolverPositivo; });
        var negB = lineas.filter(function (l) { return l._resolverNegativo; });
        resumenNode = VEVA.dom.el('div', { class: 'flex flex-col' }, [
          VEVA.dom.el('span', { class: 'text-[12px] font-semibold text-[#0a2540]' }, [posB.length + ' a subir' + (posB.length ? ' · ' + resumenChipsTexto(posB, montoEfectivo) : '')]),
          negB.length ? VEVA.dom.el('span', { class: 'text-[11px] text-[#8792a2]' }, [negB.length + ' a rechazar · ' + resumenChipsTexto(negB, montoEfectivo)]) : null
        ].filter(Boolean));
        bulkBtns.push(renderBulkBtn('Subir', 'Subiendo...', function () { resolverBanca(lineas); }, 'primario'));
      } else if (tab === 'aplicado' && esTesoreria()) {
        var posA = lineas.filter(function (l) { return l._resolverPositivo; });
        var negA = lineas.filter(function (l) { return l._resolverNegativo; });
        resumenNode = VEVA.dom.el('div', { class: 'flex flex-col' }, [
          VEVA.dom.el('span', { class: 'text-[12px] font-semibold text-[#0a2540]' }, [posA.length + ' a aplicar' + (posA.length ? ' · ' + resumenChipsTexto(posA, montoResolverAplicado) : '')]),
          negA.length ? VEVA.dom.el('span', { class: 'text-[11px] text-[#8792a2]' }, [negA.length + ' a marcar no pagada · ' + resumenChipsTexto(negA, montoEfectivo)]) : null
        ].filter(Boolean));
        bulkBtns.push(renderBulkBtn('Aplicar', 'Aplicando...', function () { resolverAplicado(lineas); }, 'primario'));
      }
      if (bulkBtns.length) {
        bodyChildren.push(VEVA.dom.el('div', { class: 'flex justify-between items-center mx-3 my-2.5 bg-white border border-[#e6ebf1] rounded-lg px-3 py-2' }, [
          resumenNode,
          VEVA.dom.el('div', { class: 'flex gap-2' }, bulkBtns)
        ]));
      }
    } else if (tab === 'rechazadas') {
      bodyChildren.push(VEVA.dom.el('div', { class: 'mx-3 my-2 bg-white border border-[#e6ebf1] rounded-lg overflow-hidden' }, lineas.map(function (l) { return renderRechazadaRow(l); })));
    } else if (tab === 'caducadas') {
      bodyChildren.push(VEVA.dom.el('div', { class: 'mx-3 my-2 bg-white border border-[#e6ebf1] rounded-lg overflow-hidden' }, lineas.map(function (l) { return renderCaducadaRow(l); })));
    }

    return VEVA.dom.el('div', { class: 'bg-[#fafbff] border border-[#e6ebf1] rounded-lg overflow-hidden pb-1' }, [header].concat(bodyChildren));
  }

  function renderRechazadaRow(l) {
    var esperando = !!l.reactivacionSolicitada;
    var accion;
    if (esperando && !esTesoreria()) {
      accion = VEVA.dom.el('span', { class: 'text-[11px] text-[#697386] italic' }, ['Reactivacion solicitada — esperando confirmacion de Tesoreria']);
    } else {
      accion = VEVA.dom.el('button', { class: 'px-2.5 py-1 bg-[#635bff] text-white rounded text-[11px] font-semibold flex-shrink-0', onClick: function () { solicitarReactivacion(l); } }, [esperando ? 'Confirmar reactivacion' : 'Solicitar reactivacion']);
    }
    return VEVA.dom.el('div', { class: 'flex items-center justify-between gap-3 px-3 py-2 border-b border-[#f6f9fc] last:border-b-0' }, [
      VEVA.dom.el('div', { class: 'min-w-0' }, [

  /** Punto 5 de la retroalimentacion: resumen condensado y SIEMPRE

  /** Busca personas en el directorio de la organizacion (Bloque E,
   * 2026-07-27) para el CC extraordinario de UNA propuesta puntual del
   * preview de carga. Debounce de 350ms (no golpear la API con cada
   * tecla), minimo 3 caracteres (mismo minimo que ya exige el backend).
   * El estado transitorio de busqueda vive directo en `g` (prefijo `_`
   * para distinguirlo de datos reales de la propuesta, mismo criterio
   * que `state.cargaExcluidos` usa aparte para las lineas). */
  function ccExtraBuscar(g, query) {
    g._ccQuery = query;
    if (g._ccDebounceTimer) clearTimeout(g._ccDebounceTimer);
    if (query.trim().length < 3) { g._ccResultados = []; g._ccBuscando = false; g._ccError = null; redraw(); return; }
    g._ccBuscando = true; g._ccError = null;
    g._ccDebounceTimer = setTimeout(function () {
      VEVA.gas('buscarContactosDirectorio', { query: query.trim() })
        .then(function (res) {
          if (res && res.status === 'success') { g._ccResultados = res.data; } else { g._ccResultados = []; g._ccError = (res && res.message) || 'Error al buscar.'; }
        })
        .catch(function (e) { g._ccResultados = []; g._ccError = String(e.message || e); })
        .finally(function () { g._ccBuscando = false; redraw(); });
    }, 350);
  }

  function ccExtraAgregar(g, persona) {
    var yaEsta = (g.ccExtra || []).some(function (c) { return c.email === persona.email; });
    if (!yaEsta) g.ccExtra = (g.ccExtra || []).concat([{ email: persona.email, nombre: persona.nombre }]);
    g._ccQuery = ''; g._ccResultados = [];
    redraw();
  }

  function ccExtraQuitar(g, email) {
    g.ccExtra = (g.ccExtra || []).filter(function (c) { return c.email !== email; });
    redraw();
  }

  /** CC extraordinario de esta propuesta puntual (opcional, poco comun) --
   * dura solo mientras dure el seguimiento de ESTA propuesta, no es la
   * lista estandar por sociedad (esa vive en "Lista de Distribucion",
   * seccion CC de Pagos). Buscador contra el directorio de la
   * organizacion, no contactos personales (decision explicita del
   * usuario, requiere el permiso nuevo de directorio). */
  function renderCcExtraGrupo(g) {
    var chips = (g.ccExtra || []).map(function (c) {
      return VEVA.dom.el('span', { class: 'inline-flex items-center gap-1 text-[10.5px] font-semibold bg-[#635bff]/10 text-[#635bff] px-2 py-0.5 rounded-full' }, [
        c.nombre || c.email,
        VEVA.dom.el('button', { class: 'hover:text-red-500', onClick: function () { ccExtraQuitar(g, c.email); } }, [VEVA.icon('x', 10)])
      ]);
    });

    var input = VEVA.dom.el('input', {
      type: 'text', placeholder: 'Buscar en el directorio (nombre o correo)…',
      'data-focus-key': 'ccextra-' + g.sociedad,
      class: 'w-full text-[11px] border border-[#e6ebf1] rounded px-2 py-1 outline-none focus:border-[#635bff]'
    }, []);
    input.value = g._ccQuery || '';
    input.addEventListener('input', function (e) { ccExtraBuscar(g, e.target.value); });

    var mostrarDropdown = g._ccQuery && g._ccQuery.trim().length >= 3;
    var dropdown = null;
    if (mostrarDropdown) {
      var opciones;
      if (g._ccBuscando) {
        opciones = [VEVA.dom.el('div', { class: 'px-2 py-1.5 text-[11px] text-[#8792a2]' }, ['Buscando…'])];
      } else if ((g._ccResultados || []).length) {
        opciones = g._ccResultados.map(function (p) {
          return VEVA.dom.el('div', {
            class: 'px-2 py-1 text-[11px] hover:bg-[#f6f9fc] cursor-pointer flex items-center justify-between gap-2',
            onClick: function () { ccExtraAgregar(g, p); }
          }, [
            VEVA.dom.el('span', { class: 'truncate' }, [p.nombre || p.email]),
            VEVA.dom.el('span', { class: 'text-[#8792a2] font-mono text-[10px] flex-shrink-0' }, [p.email])
          ]);
        });
      } else {
        opciones = [VEVA.dom.el('div', { class: 'px-2 py-1.5 text-[11px] text-[#8792a2] italic' }, [g._ccError || 'Sin resultados.'])];
      }
      dropdown = VEVA.dom.el('div', { class: 'border border-[#e6ebf1] rounded-lg bg-white shadow-sm max-h-[140px] overflow-y-auto' }, opciones);
    }

    return VEVA.dom.el('div', { class: 'px-3 py-2 border-t border-[#f6f9fc] bg-[#fafbff] space-y-1.5' }, [
      VEVA.dom.el('p', { class: 'text-[10px] font-bold text-[#697386] uppercase tracking-wider' }, ['Copiar a alguien más (opcional, solo para esta propuesta)']),
      chips.length ? VEVA.dom.el('div', { class: 'flex flex-wrap gap-1.5' }, chips) : null,
      input,
      dropdown
    ].filter(Boolean));

  function renderCargaPanel() {
    if (!state.cargaAbierta) return null;

    var children = [
      VEVA.dom.el('p', { class: 'text-[12px] text-[#697386]' }, ['Sube el Excel real de la propuesta (hoja "PROPUESTA CONSOLIDADA"). Se previsualiza antes de crear nada — puedes desmarcar líneas antes de confirmar.'])

      }, [VEVA.icon('upload-cloud', 26, 'text-[#635bff] mx-auto mb-1.5'), VEVA.dom.el('p', { class: 'text-[12.5px] font-bold' }, ['Arrastra el .xlsx o haz click para seleccionar'])]);

    } else if (!state.cargaPreview) {

        ])
      ]));
    } else {
      var pv = state.cargaPreview;
      if (pv.hojas && pv.hojas.length) {
        children.push(VEVA.dom.el('p', { class: 'text-[11.5px] text-[#697386]' }, ['Hoja(s) "' + pv.hojas.join('", "') + '": ' + pv.totalFilasValidas + ' línea(s) válida(s)' + (pv.filasOmitidasSubtotal ? ', ' + pv.filasOmitidasSubtotal + ' fila(s) de subtotal omitidas' : '') + '.']));
      }
      if (pv.erroresFila && pv.erroresFila.length) {
        children.push(VEVA.dom.el('div', { class: 'bg-red-50 border border-red-100 rounded-lg p-3 space-y-0.5' }, [
          VEVA.dom.el('p', { class: 'text-[11px] font-bold text-red-700 uppercase tracking-wide' }, [pv.erroresFila.length + ' fila(s) con error — no se importarán']),
        ].concat(pv.erroresFila.map(function (e) { return VEVA.dom.el('p', { class: 'text-[11px] text-red-700' }, ['Hoja "' + e.hoja + '", fila ' + e.fila + ': ' + e.motivo]); }))));

  function renderConciliacionSociedad(g, saldoPorCuenta) {
    var key = 'soc:' + g.sociedad;
    var expanded = state.conciliacionExpanded[key] !== false;
    var pendientesTotal = g.cuentas.reduce(function (s, c) { return s + c.partidas.filter(function (p) { return p.estadoConciliacion === 'pendiente' || p.estadoConciliacion === 'sin_cuenta'; }).length; }, 0);

  function renderConciliacionCuenta(sociedad, c, saldoPorCuenta) {

  // ---- Render: pestaña Comprobantes (fase 7) ----

      if (f.fechaDesde && (!p.aplicadoFecha || String(p.aplicadoFecha).slice(0, 10) < f.fechaDesde)) return false;

      inputHasta.addEventListener('change', function (e) { f.fechaHasta = e.target.value; redraw(); });
      var soc = {};
      (state.comprobantesData || []).forEach(function (p) { if (p.sociedad) soc[p.sociedad] = true; });
      var selSociedad = VEVA.dom.el('select', { class: 'border border-[#e6ebf1] rounded px-2 py-1.5 text-[12.5px] outline-none focus:border-[#635bff] min-w-[130px]' },
        [VEVA.dom.el('option', { value: '' }, ['Todas'])].concat(Object.keys(soc).sort().map(function (s) { return VEVA.dom.el('option', { value: s }, [s]); })));
      selSociedad.value = f.sociedad;
      selSociedad.addEventListener('change', function (e) { f.sociedad = e.target.value; redraw(); });
      var inputBuscar = VEVA.dom.el('input', { type: 'text', 'data-focus-key': 'comprobantes-buscar', class: 'w-full border border-[#e6ebf1] rounded px-2 py-1.5 text-[12.5px] outline-none focus:border-[#635bff]', placeholder: 'Proveedor / folio...' }, []);
      inputBuscar.value = f.busqueda;
      inputBuscar.addEventListener('input', function (e) { f.busqueda = e.target.value; redraw(); });
      var btnLimpiar = VEVA.dom.el('button', { class: 'px-3 py-1.5 border border-[#e6ebf1] rounded text-[12px] font-semibold hover:border-[#635bff]', onClick: function () { state.comprobantesFiltros = { fechaDesde: '', fechaHasta: '', sociedad: '', busqueda: '' }; redraw(); } }, ['Limpiar']);
      children.push(VEVA.dom.el('div', { class: 'flex flex-wrap items-end gap-3 mt-2.5 bg-white border border-[#e6ebf1] rounded-xl p-3' }, [
        campo('Desde', inputDesde), campo('Hasta', inputHasta), campo('Sociedad', selSociedad),
        VEVA.dom.el('div', { class: 'flex-1 min-w-[180px]' }, [campo('Buscar', inputBuscar)]),
        btnLimpiar
      ]));
    }
    return VEVA.dom.el('div', { class: 'mb-3' }, children);
  }

  function fmtFechaCortaLocal(diaIso) { return diaIso ? diaIso.split('-').reverse().join('/') : ''; }

  function renderComprobantesTab() {
    if (state.comprobantesLoading || !state.comprobantesData) {
      return VEVA.dom.el('div', { class: 'bg-white rounded-xl border border-[#e6ebf1] p-10 flex items-center justify-center gap-3' }, [VEVA.icon('loader', 20, 'animate-spin text-[#635bff]'), VEVA.dom.el('span', { class: 'text-[13px] text-[#697386]' }, ['Cargando comprobantes...'])]);
    }
    var partidas = _comprobantesFiltrados();
    var seleccionadas = partidas.filter(function (p) { return state.comprobantesSeleccion[p.id]; });

    var header = VEVA.dom.el('div', { class: 'flex items-center justify-between mb-3' }, [
      VEVA.dom.el('p', { class: 'text-[12px] text-[#697386]' }, ['Independiente de conciliación — se puede subir el comprobante sin esperar a identificar el movimiento bancario.']),
      VEVA.dom.el('button', { class: 'flex items-center gap-1.5 px-3 py-1.5 border border-[#e6ebf1] rounded-lg text-[12px] font-bold hover:border-[#635bff]', onClick: cargarComprobantes }, [VEVA.icon('refresh-cw', 12), 'Actualizar'])
    ]);

    var filtroChip = renderComprobantesFiltroChip();

    if (!state.comprobantesData.length) {
      return VEVA.dom.el('div', {}, [header, VEVA.dom.el('div', { class: 'bg-white rounded-xl border border-[#e6ebf1] p-10 text-center text-[13px] text-[#697386]' }, ['No hay partidas con pagos aplicados todavía.'])]);
    }
    if (!partidas.length) {
      return VEVA.dom.el('div', {}, [header, filtroChip, VEVA.dom.el('div', { class: 'bg-white rounded-xl border border-[#e6ebf1] p-10 text-center text-[13px] text-[#697386]' }, ['Ninguna partida coincide con el filtro.'])]);
    }

    var table = VEVA.dom.el('div', { class: 'bg-white border border-[#e6ebf1] rounded-xl overflow-hidden' }, [renderComprobantesHead()].concat(partidas.map(renderComprobantePartidaRow)));

    var bulkBar = null;
    if (seleccionadas.length && puedeConciliarComprobantes()) {
      bulkBar = VEVA.dom.el('div', { class: 'flex items-center justify-between mt-2 px-3 py-2 bg-[#635bff]/5 border border-[#635bff]/20 rounded-lg text-[12px]' }, [
        VEVA.dom.el('span', {}, [seleccionadas.length + ' partida(s) seleccionada(s)']),
        VEVA.dom.el('button', { class: 'px-3 py-1.5 bg-[#635bff] text-white rounded text-[11px] font-bold', onClick: function () { abrirSelectorArchivo(seleccionadas.map(function (p) { return p.id; })); } }, ['Adjuntar 1 archivo consolidado a la selección'])
      ]);
    }

    return VEVA.dom.el('div', {}, [header, filtroChip, table, bulkBar].filter(Boolean));
  }

  function renderComprobantesHead() {
    // Mismo hallazgo/fix que renderColHead: cada etiqueta en su propio
    // <span> (via celdaHead), nunca strings sueltos seguidos como hijos
    // directos de un div `grid` -- se fusionan en una sola celda.
    return VEVA.dom.el('div', { class: 'grid gap-2 px-3 py-1.5 bg-[#f6f9fc] border-b border-[#e6ebf1] text-[9.5px] font-bold text-[#8792a2] uppercase tracking-wide', style: 'grid-template-columns:20px 70px 110px 1.4fr 100px 1.2fr' }, [celdaHead(''), celdaHead('Fecha'), celdaHead('Sociedad'), celdaHead('Proveedor / Concepto'), celdaHead('Importe'), celdaHead('Comprobante')]);
  }

  function renderComprobantePartidaRow(p) {
    var puedeEditar = puedeConciliarComprobantes();
    var cb = VEVA.dom.el('input', { type: 'checkbox', disabled: puedeEditar ? null : 'disabled' }, []);
    cb.checked = !!state.comprobantesSeleccion[p.id];
    if (puedeEditar) cb.addEventListener('change', function (e) { state.comprobantesSeleccion[p.id] = e.target.checked; redraw(); });

    var compCell;
    if (p.comprobantes.length) {
      compCell = VEVA.dom.el('div', { class: 'flex flex-wrap gap-1' }, p.comprobantes.map(function (c) {
        return VEVA.dom.el('span', {
          class: 'inline-flex items-center gap-1 text-[10.5px] bg-emerald-50 text-emerald-700 border border-emerald-100 rounded px-2 py-0.5 cursor-pointer',
          onClick: function () {
            var key = p.id + '|' + c.comprobanteId;
            state.comprobantesPanelAbierto = state.comprobantesPanelAbierto === key ? null : key;
            redraw();
          }
        }, ['📄 ' + c.archivoNombre + (c.totalPartidas > 1 ? ' · ' + c.totalPartidas + ' pagos' : '')]);
      }));
    } else {
      compCell = VEVA.dom.el('span', { class: 'text-[11px] text-[#8792a2]' }, ['Sin comprobante']);
    }

    var row = VEVA.dom.el('div', { class: 'grid gap-2 items-center px-3 py-2 border-b border-[#f6f9fc] last:border-0', style: 'grid-template-columns:20px 70px 110px 1.4fr 100px 1.2fr' }, [
      cb,
      VEVA.dom.el('span', { class: 'text-[11px] font-mono text-[#697386]' }, [p.aplicadoFecha ? String(p.aplicadoFecha).slice(0, 10) : '—']),
      VEVA.dom.el('span', { class: 'text-[11px] text-[#697386]' }, [p.sociedad]),
      VEVA.dom.el('div', {}, [VEVA.dom.el('div', { class: 'text-[12px] font-semibold' }, [p.proveedor]), VEVA.dom.el('div', { class: 'text-[10.5px] text-[#8792a2] truncate' }, [p.desc || ''])]),
      VEVA.dom.el('span', { class: 'text-right text-[12px] font-mono font-semibold' }, [fmtMontoDivisa(p.monto, p.moneda)]),
      compCell
    ]);

    var panels = p.comprobantes.filter(function (c) { return state.comprobantesPanelAbierto === (p.id + '|' + c.comprobanteId); }).map(function (c) {
      return VEVA.dom.el('div', { class: 'px-3 pb-2 pl-8 text-[11px] text-[#697386]' }, [
        VEVA.dom.el('div', { class: 'flex items-center justify-between bg-[#fafbff] border border-[#e6ebf1] rounded-lg px-2.5 py-1.5' }, [
          VEVA.dom.el('a', { href: c.driveUrl, target: '_blank', class: 'text-[#635bff] font-semibold hover:underline' }, [c.archivoNombre + (c.totalPartidas > 1 ? ' (' + c.totalPartidas + ' pagos)' : '')]),
          puedeEditar ? VEVA.dom.el('button', { class: 'text-red-600 font-bold text-[10.5px]', onClick: function () { desvincular(c.comprobanteId, p.id); } }, ['Quitar de esta partida']) : null
        ])
      ]);
    });

    return panels.length ? VEVA.dom.el('div', {}, [row].concat(panels)) : row;
  }

  function _redrawInner() {
    var root = document.getElementById('view-pagos-root');
    if (!root) return;
    VEVA.dom.clear(root);

    // Bloque 2 (2026-07-26): acceso bloqueado -- se corta aqui, antes de
    // cualquier otro render que asuma state.usuario/state.propuestas ya
    // cargados (ej. renderCargaToggle usa puedeCargar(), que leeria un
    // usuario nulo).
    if (state.sinAcceso) {
      root.appendChild(VEVA.dom.el('div', { class: 'bg-white rounded-xl border border-[#e6ebf1] p-10 text-center space-y-3 max-w-lg mx-auto mt-10' }, [
        VEVA.icon('shield', 32, 'text-[#e6ebf1] mx-auto'),
        VEVA.dom.el('p', { class: 'text-[15px] font-bold text-[#0a2540]' }, ['Sin acceso a Propuestas de Pago']),
        VEVA.dom.el('p', { class: 'text-[13px] text-[#697386]' }, [state.sinAccesoMensaje || 'Tu cuenta no está registrada con un rol activo en CAT_USUARIOS.']),
        VEVA.dom.el('button', { class: 'px-4 py-1.5 bg-[#635bff] text-white rounded-lg text-[12px] font-bold', onClick: cargar }, ['Reintentar'])
      ]));
      return;
    }

    var cargaBtn = renderCargaToggle();
    root.appendChild(VEVA.dom.el('div', { class: 'flex items-start justify-between gap-3' }, [
      VEVA.dom.el('div', {}, [
        VEVA.dom.el('h2', { class: 'text-2xl font-bold tracking-tight' }, ['Propuestas de Pago']),
        VEVA.dom.el('p', { class: 'text-[13px] text-[#697386] mt-0.5' }, ['Workflow de aprobacion por fases — contabilidad, tesoreria, liberacion, banca, aplicado'])
      ]),
      cargaBtn
    ].filter(Boolean)));

    var cargaPanel = renderCargaPanel();
    if (cargaPanel) root.appendChild(cargaPanel);

    if (state.error) root.appendChild(VEVA.dom.el('div', { class: 'bg-red-50 border border-red-100 p-4 rounded-xl text-[13px] text-red-700' }, [state.error]));

    if (state.loading) {
      root.appendChild(VEVA.dom.el('div', { class: 'bg-white rounded-xl border border-[#e6ebf1] p-10 flex items-center justify-center gap-3' }, [VEVA.icon('loader', 20, 'animate-spin text-[#635bff]'), VEVA.dom.el('span', { class: 'text-[13px] text-[#697386]' }, ['Cargando propuestas...'])]));
      return;
    }

    var esTabEspecial = state.activeTab === 'conciliacion' || state.activeTab === 'comprobantes';
    if (!esTabEspecial) root.appendChild(renderSocCards());
    var chip = renderFilterChip();
    if (chip && !esTabEspecial) root.appendChild(chip);
    root.appendChild(renderTabs());

    if (state.activeTab === 'conciliacion') { root.appendChild(renderConciliacionTab()); return; }
    if (state.activeTab === 'comprobantes') { root.appendChild(renderComprobantesTab()); return; }

    var resumenSel = renderResumenSeleccion();
    if (resumenSel) root.appendChild(resumenSel);
    root.appendChild(renderGroups());
  }

  /** Bug real corregido 2026-07-26: `_redrawInner` reconstruye TODO el
   * DOM (patron sin virtual DOM de toda la app) -- cualquier <input> con
   * foco se destruye y se vuelve a crear en cada tecla, perdiendo el
   * foco/cursor/scroll. Confirmado que este es el UNICO lugar de las 15
   * vistas de TESO donde un handler de "input" llama redraw() de forma
   * sincrona (el resto solo muta `state` sin redibujar en cada tecla).
   * Fix generico y local a este archivo: envolver `_redrawInner` para
   * capturar que campo tenia el foco (via `data-focus-key`, no un id
   * fijo -- las filas se recrean con las mismas keys logicas aunque el
   * nodo DOM sea nuevo), su seleccion de texto, y el scroll del panel
   * principal, y restaurarlos despues de reconstruir. No se toca
   * Shared_Core.html (compartido con las otras 14 vistas). */
  function redraw() {
    var mainScroll = document.getElementById('veva-main');
    var scrollTop = mainScroll ? mainScroll.scrollTop : 0;
    var activo = document.activeElement;
    var focusKey = null, selStart = null, selEnd = null;
    if (activo && activo.hasAttribute && activo.hasAttribute('data-focus-key')) {
      focusKey = activo.getAttribute('data-focus-key');
      if (typeof activo.selectionStart === 'number') { selStart = activo.selectionStart; selEnd = activo.selectionEnd; }
    }

    _redrawInner();

    if (focusKey) {
      var el = document.querySelector('[data-focus-key="' + focusKey + '"]');
      if (el) {
        el.focus();
        if (selStart != null && el.setSelectionRange) { try { el.setSelectionRange(selStart, selEnd); } catch (e) { } }
      }
    }
    if (mainScroll) {
      mainScroll.scrollTop = scrollTop;
      // Bug reportado (2026-08-12): el salto de scroll seguia pasando
      // pese al restore de arriba -- el "scroll anchoring" nativo del
      // navegador puede reajustar scrollTop en el siguiente ciclo de
      // layout/paint, ya DESPUES de que este script lo fijo (ademas de
      // overflow-anchor:none en #veva-main, Index_1.html). Se refuerza
      // con un segundo set en el proximo frame como defensa adicional.
      requestAnimationFrame(function () { mainScroll.scrollTop = scrollTop; });
    }
  }

  VEVA.registerView('workflow-pagos', {
    render: function (mount) {
      mount.appendChild(VEVA.dom.el('div', { id: 'view-pagos-root', class: 'space-y-5' }, []));
      cargar();
    },
    destroy: function () { /* sin listeners globales que limpiar en esta vista */ }
  });
})();
</script>
